name: Food database

# Downloads the USDA FoodData Central "SR Legacy" dataset (public domain), converts it to the compact
# JSON the app uses (scripts/build-food-db.mjs) and publishes it as the "food-db" release.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/sharp-cray-8y0uuv]
    paths:
      - "scripts/build-food-db.mjs"
      - ".github/workflows/food-db.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download SR Legacy
        run: |
          set -e
          for url in \
            https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip \
            https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2019-04-02.zip; do
            if curl -fsSL --retry 3 -o sr.zip "$url"; then echo "downloaded $url"; break; fi
          done
          test -s sr.zip
          unzip -q sr.zip -d sr
          find sr -name '*.csv' | head -20
      - name: Build food-db.json
        run: node scripts/build-food-db.mjs sr usda-foods.json
      - name: Publish as the food-db release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete food-db --yes --cleanup-tag || true
          gh release create food-db usda-foods.json --target "${{ github.sha }}" --prerelease \
            --title "Food database (USDA SR Legacy)" \
            --notes "Generated by scripts/build-food-db.mjs from USDA FoodData Central SR Legacy (public domain). Nutrients per 100 g plus USDA household portions."
