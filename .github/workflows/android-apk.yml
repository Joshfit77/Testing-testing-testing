name: Android APK

# Builds a debug-signed APK of the offline edition (standalone/index.html) that can be installed
# directly on an Android phone for testing, and publishes it as the "android-latest" release.
# Not for the Play Store: store builds need your own signing key and the online app URL.
#
# Least privilege: the build job (npm install scripts, Gradle, the Android SDK) gets a read-only token.
# Only the publish job can write to the repository. It runs no repository code: it downloads the APK
# the build job uploaded, checks it against the SHA-256 the build job recorded, and replaces the release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace the android-latest release with this APK (a manual run only compiles and keeps the APK as a run artifact unless ticked)"
        type: boolean
        default: false
      dry_run:
        description: "Run the publish job without changing the release (downloads and checks the APK only)"
        type: boolean
        default: false
  push:
    branches: [main, claude/sharp-cray-8y0uuv]
    paths:
      - "standalone/**"
      - "android/**"
      - "capacitor.config.ts"
      - "resources/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build the APK (read-only token)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Copy the offline edition into the Android project
        run: CAP_MODE=standalone npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename the APK and record its SHA-256
        id: hash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk NarrowGateFitness-offline.apk
          sha=$(sha256sum NarrowGateFitness-offline.apk | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NarrowGateFitness-offline-apk
          path: NarrowGateFitness-offline.apk
          if-no-files-found: error

  publish:
    name: Publish as the android-latest release
    needs: apk
    # Pushes to the listed branches publish as before; a manual run publishes only when asked.
    if: github.event_name == 'push' || inputs.publish == true || inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # replace the release
      actions: read # download this run's artifact
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the APK from the build job and check its SHA-256
        env:
          RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA256: ${{ needs.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256"
          gh run download "$RUN_ID" --name NarrowGateFitness-offline-apk --dir out
          echo "$EXPECTED_SHA256  out/NarrowGateFitness-offline.apk" | sha256sum --check --strict
      - name: Dry run (nothing changed)
        if: inputs.dry_run == true
        run: |
          gh release view android-latest --json tagName,publishedAt || echo "No android-latest release yet."
          echo "Dry run: the APK was downloaded and checked; the release was left as it is."
      - name: Replace the android-latest release
        if: inputs.dry_run != true
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/NarrowGateFitness-offline.apk \
            --target "$TARGET_SHA" --prerelease \
            --title "Narrow Gate Fitness: Android test app (offline edition)" \
            --notes "Debug-signed test build of the offline edition. Install on Android by opening the APK (allow installs from this source when asked). Data is stored on the phone. Not for the Play Store."
