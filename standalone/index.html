    const f = { n: `${p.product_name || "Product"}${p.brands ? ` (${p.brands.split(",")[0]})` : ""}`, serving: "100 g", kcal: Math.round(kcal), p: round(n.proteins_100g || 0, 1), c: round(n.carbohydrates_100g || 0, 1), f: round(n.fat_100g || 0, 1) };
    foodOptCache = [f];
    if (box) box.innerHTML = `<div class="list"><div class="li" style="align-items:flex-start"><div class="grow"><div class="t" style="white-space:normal">${esc(f.n)}</div><div class="small muted num">per 100 g · ${f.kcal} kcal · P ${f.p} · C ${f.c} · F ${f.f}</div><div class="tiny dim">Open Food Facts (community data). Check the label.</div></div>
      <div class="row" style="gap:6px;flex-wrap:nowrap"><input class="input num" style="width:64px;min-height:40px;padding:6px;text-align:center" inputmode="decimal" aria-label="Servings of 100 g" data-serv="0" value="1"><button class="btn sm primary" data-a="addfood" data-i="0">${icon("plus")}</button></div></div></div>`;

async function startScan() {
  const box = $("scanres");
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices) { if (box) box.innerHTML = `<p class="small">Live scanning isn't supported in this browser preview. Type the barcode below. (The full app scans on iPhone and Android.)</p>`; return; }

    const v = $("scanvid"); v.srcObject = scanStream; v.hidden = false; await v.play();
    const det = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
    const loop = async () => { if (!scanStream) return; try { const codes = await det.detect(v); const c = codes[0] && codes[0].rawValue; if (c) { stopScan(); v.hidden = true; lookupBarcode(c); return; } } catch (_) { } requestAnimationFrame(loop); };
    loop();

const COACH_RULES = `You are the AI coach inside Narrow Gate Fitness, a Christian-friendly strength and conditioning app (tagline "Rooted in faith. Built for strength."). Speak like a knowledgeable, encouraging strength coach: warm, direct, practical.
Rules:

function renderMd(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let out = "", inList = false, para = [];
  const flush = () => { if (para.length) { out += `<p>${para.join("<br>")}</p>`; para = []; } };
  lines.forEach(l => {
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m) { flush(); if (!inList) { out += "<ul>"; inList = true; } out += `<li>${m[1]}</li>`; }
    else { if (inList) { out += "</ul>"; inList = false; } if (l.trim()) para.push(l.replace(/^#+\s*/, "")); else flush(); }
  });
  flush(); if (inList) out += "</ul>"; return out;
}

async function sendChat(q) {

  if (!sample) { render(); return; }
  S.chat.push({ role: "user", content: q }); S.chat = S.chat.slice(-20); save();
  coachBusy = new AbortController(); render();
  const hist = S.chat.slice(S.chat.findIndex(m => m.role === "user"));
  const turns = hist.map(m => ({ role: m.role, content: m.content }));
  turns[turns.length - 1].content = `${COACH_RULES}\n\nCurrent data:\n${coachContext()}\n\nUser message:\n${q}`;

function confetti(n = 120) {

  const ctx = c.getContext("2d"); if (!ctx) { c.remove(); return; }

  c.width = w * dpr; c.height = h * dpr; ctx.scale(dpr, dpr);

  let f = 0;
  const tick = () => { f++; ctx.clearRect(0, 0, w, h); const fade = Math.max(0, 1 - Math.max(0, f - 70) / 50);

}

    case "go": { const p = {}; if (d.s) p.s = d.s; if (d.id) p.id = d.id; go(d.to, p); break; }
    case "back": back(); break;
    case "more": openSheet(`<div class="row between"><h2>More</h2><button class="icon-btn" data-a="close" aria-label="Close">${icon("x")}</button></div><div class="list">${MORE.filter(n => !n.faith || S.faith).map(n => `<button class="li" data-a="go" data-to="${n.v}"><span class="gold">${icon(n.i)}</span><div class="grow t">${n.l}</div>${icon("chev", "chev")}</button>`).join("")}</div>`); break;
    case "close": closeOverlay(); break;
    case "cat": R.p = { ...R.p, cat: d.c }; render(); break;
    case "pwk": R.p = { ...R.p, wk: +d.i }; render(); break;
    case "range": R.p = { r: +d.r }; render(); break;
    case "activate": {
      const p = PR[d.s];
      const doIt = () => { S.active = { s: d.s, w: 0, d: 0, started: Date.now() }; save(); closeOverlay(); render(); toast(`${p.n} is now your active program.`); };
      if (S.active && S.active.s !== d.s) confirmBox("Switch program?", `Your progress in ${esc(PR[S.active.s]?.n || "your current program")} stays in your history, but your schedule will move to ${esc(p.n)}, week 1.`, "Switch", doIt);
      else doIt();
      break;
    }
    case "start-next": { const ns = nextSession(); if (ns && !ns.done) startWorkout(ns.p.s, ns.w, ns.d); break; }
    case "start-day": startWorkout(d.s, +d.w, +d.d); break;
    case "quick": quickWorkout(); break;
    case "done": {
      const x = D.ex[+d.ei], s = x.sets[+d.si]; s.done = !s.done;
      if (s.done && x.rest) D.rest = { end: Date.now() + x.rest * 1000, total: x.rest };
      if (s.done && navigator.vibrate) { try { navigator.vibrate(30); } catch (_) { } }
      save(); render(); break;
    }
    case "addset": { const x = D.ex[+d.ei]; const l = x.sets[x.sets.length - 1]; x.sets.push({ w: l ? l.w : 0, r: l ? l.r : 8, sec: l ? l.sec : 0, done: false }); save(); render(); break; }
    case "rmset": { const x = D.ex[+d.ei]; if (x.sets.length > 1) x.sets.pop(); save(); render(); break; }
    case "skip": { const x = D.ex[+d.ei]; x.skipped = !x.skipped; save(); render(); break; }
    case "swap": {
      const x = D.ex[+d.ei]; const e = EX[x.s];
      openSheet(`<div class="row between"><h2>Swap ${esc(e.n)}</h2><button class="icon-btn" data-a="close" aria-label="Close">${icon("x")}</button></div><div class="list">${e.a.filter(s => EX[s]).map(s => `<button class="li" data-a="swap-to" data-ei="${d.ei}" data-s="${s}"><div class="grow"><div class="t">${esc(EX[s].n)}</div><div class="small muted">${EX[s].e.map(titleCase).join(", ")}</div></div>${icon("swap", "chev")}</button>`).join("")}</div>`);
      break;
    }
    case "swap-to": {
      const ei = +d.ei, x = D.ex[ei];
      const nx = makeEx(d.s, x.sets.length, x.target, EX[d.s].t ? x.tsec || 30 : 0, x.rest); nx.from = x.from || x.s;
      D.ex[ei] = nx; save(); closeOverlay(); render(); break;
    }
    case "addex": openSheet(`<div class="row between"><h2>Add exercise</h2><button class="icon-btn" data-a="close" aria-label="Close">${icon("x")}</button></div><input class="input" data-search="pick" placeholder="Search exercises" autocomplete="off"><div class="list" id="picklist">${pickerRows("", "add-to")}</div>`); break;
    case "add-to": { D.ex.push(makeEx(d.s, 3, EX[d.s].t ? "" : "8-12", EX[d.s].t ? 30 : 0, 90)); save(); closeOverlay(); render(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0); break; }
    case "rest-adj": if (D && D.rest) { D.rest.end += (+d.n) * 1000; save(); renderRest(); } break;
    case "rest-skip": if (D) { D.rest = null; save(); renderRest(); } break;
    case "finish": finishWorkout(); break;
    case "discard": confirmBox("Discard workout?", "Sets you've logged in this session will be deleted. This can't be undone.", "Discard", () => { S.draft = null; save(); closeOverlay(); go("train", {}, false); }); break;
    case "confirm-ok": { const cb = confirmCb; confirmCb = null; if (cb) cb(); break; }
    case "del-workout": confirmBox("Delete workout?", "This removes it from your history and charts. This can't be undone.", "Delete", () => { S.workouts = S.workouts.filter(w => w.id !== d.id); save(); closeOverlay(); stack.pop(); go("history", {}, false); toast("Workout deleted."); }); break;
    case "water": { const k = d.k; const f = S.food[k] = foodDay(k); f.water = Math.max(0, (f.water || 0) + (+d.n)); save(); render(); break; }
    case "addfood-open": openFoodSheet(d.k, d.m); break;
    case "fmeal": FS.meal = d.m; openSheet(foodSheet()); break;
    case "ftab": stopScan(); FS.tab = d.t; openSheet(foodSheet()); break;
    case "addfood": {
      const f = foodOptCache[+d.i]; if (!f || !FS) break;
      const inp = document.querySelector(`[data-serv="${d.i}"]`);
      const q = Math.min(50, Math.max(0, parseFloat(String(inp ? inp.value : "1").replace(",", ".")) || 0));
      if (!(q > 0)) { toast("Enter how many servings."); break; }
      const base = { n: f.n, serving: f.serving, kcal: f.kcal, p: f.p, c: f.c, f: f.f };
      logFood({ n: f.n, serving: f.serving, qty: round(q, 2), kcal: round(f.kcal * q, 0), p: round(f.p * q, 1), c: round(f.c * q, 1), f: round(f.f * q, 1), base });
      break;
    }
    case "rmmyfood": S.myFoods = S.myFoods.filter(f => f.id !== d.id); save(); render(); break;
    case "rmfood": { const f = foodDay(d.k); f.items = f.items.filter(i => i.id !== d.id); S.food[d.k] = f; save(); render(); break; }
    case "fday": { const cur = R.p.day ? new Date(R.p.day + "T12:00:00").getTime() : Date.now(); const n = +d.n; const nd = n === 0 ? Date.now() : cur + n * DAY; R.p = { day: Math.min(startOfDay(nd), startOfDay(Date.now())) === startOfDay(Date.now()) ? undefined : dayKey(nd) }; render(); break; }
    case "verse": R.p = { vi: +d.n }; render(); break;
    case "b-open": newBuilder(); go("build"); break;
    case "explore": seed(); registerCustom(); stack.length = 0; go("home", {}, false); toast("Sample data loaded. Reset any time in Profile."); break;
    case "su-set": SU[d.k] = d.v; SU.err = ""; render(); break;
    case "su-back": SU.step = Math.max(0, SU.step - 1); SU.err = ""; render(); pageAnim(); break;
    case "su-next": { const err = suValidate(); SU.err = err; if (err) { render(); break; } if (SU.step < 2) { SU.step++; render(); pageAnim(); window.scrollTo(0, 0); } else finishSetup(); break; }
    case "diet-open": R.p = { open: R.p.open === d.id ? "_" : d.id }; render(); break;
    case "diet-choose": S.diet = d.id; save(); render(); toast(`Your diet is now ${NGB.DIETS[d.id].name}. Your targets were updated to match.`); break;
    case "edit-details": newSetup(); go("setup"); break;
    case "b-type": BS.type = d.t; BS.goal = null; BS.err = ""; BS.preview = null; render(); break;
    case "b-set": BS[d.k] = d.v; BS.err = ""; BS.preview = null; if (d.k === "goal") { BS.weeks = null; bDefaults(); } render(); break;
    case "b-mode": BS.mode[d.l] = d.m; BS.preview = null; render(); break;
    case "b-cardio": BS.cardio.modality = d.m; BS.preview = null; render(); break;
    case "b-preset": BS.equipment = EQUIP_PRESETS[+d.i][1].slice(); BS.preview = null; render(); break;
    case "b-eq": BS.equipment = BS.equipment.includes(d.e) ? BS.equipment.filter(x => x !== d.e) : [...BS.equipment, d.e]; BS.preview = null; render(); break;
    case "b-wk": BS.wk = +d.i; render(); break;
    case "b-back": BS.step = Math.max(0, BS.step - 1); BS.err = ""; render(); pageAnim(); window.scrollTo(0, 0); break;
    case "b-next": { const steps = bSteps(); const err = bValidate(steps[BS.step]); BS.err = err; if (!err) { if (steps[BS.step] === "type") bDefaults(); BS.step++; BS.wk = 0; } render(); if (!err) { pageAnim(); window.scrollTo(0, 0); } break; }
    case "b-build": {
      const pv = BS.preview; if (!pv || pv.error) break;
      const prog = bToDemo(pv.seed, pv.weeks);
      S.custom = [...(S.custom || []), prog]; PR[prog.s] = prog;
      S.me = { age: +BS.age, heightCm: +BS.heightCm, kg: +BS.kg, experience: BS.experience, equipment: BS.equipment };
      const today = startOfDay(Date.now()); if (Math.abs(currentBwKg() - BS.kg) > 0.05) { S.bw = S.bw.filter(b => startOfDay(b.t) !== today); S.bw.push({ t: Date.now(), kg: +BS.kg }); }
      S.active = { s: prog.s, w: 0, d: 0, started: Date.now() }; save(); BS = null; stack.length = 0;
      go("program", { s: prog.s }, false); confetti(90); toast(`${prog.n} is now your active program.`); break;
    }
    case "photo": { const p = PHOTOS.find(x => x.id === d.id); if (p) openSheet(photoViewer(p)); break; }
    case "rmphoto": confirmBox("Delete photo?", "This removes it from this browser. This can't be undone.", "Delete", () => { PHOTOS = PHOTOS.filter(x => x.id !== d.id); savePhotos(); closeOverlay(); render(); toast("Photo deleted."); }); break;
    case "compare-start": comparePick = []; openSheet(`<div class="row between"><h2>Pick two photos</h2><button class="icon-btn" data-a="close" aria-label="Close">${icon("x")}</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[...PHOTOS].sort((a, b) => a.t - b.t).map(p => `<button class="card" style="padding:0;overflow:hidden;aspect-ratio:3/4" data-a="compare-pick" data-id="${p.id}" aria-pressed="false"><img src="${p.src}" alt="Photo from ${fmtDate(p.t)}" style="width:100%;height:100%;object-fit:cover"></button>`).join("")}</div>`); break;
    case "compare-pick": { if (!comparePick.includes(d.id)) comparePick.push(d.id); t.style.outline = "3px solid var(--gold)"; if (comparePick.length === 2) { const [a, b] = comparePick.map(id => PHOTOS.find(p => p.id === id)); openSheet(compareView(a, b)); } break; }
    case "ch-start": openSheet(`<div class="row between"><h2>40 Days Through the Narrow Gate</h2><button class="icon-btn" data-a="close" aria-label="Close">${icon("x")}</button></div><p>Each day: one scripture, a short devotional, a prayer and one training step. Day 1 is today. Check off reading and training; missed a day? You can catch up. Grace, not perfection.</p><div class="row"><button class="btn primary" data-a="ch-begin">Begin day 1</button><button class="btn" data-a="close">Not now</button></div>`); break;
    case "ch-begin": S.ch = { start: startOfDay(Date.now()), checks: {} }; save(); closeOverlay(); render(); toast("Challenge started. Day 1 is ready."); break;
    case "ch-day": if (S.ch) openSheet(chSheet(Math.max(1, Math.min(+d.d, chDay())))); break;
    case "ch-leave": confirmBox("Leave the challenge?", "Your check-ins will be cleared from this browser.", "Leave", () => { S.ch = null; save(); closeOverlay(); render(); }); break;
    case "scan-start": startScan(); break;
    case "rem-day": { const r = S.rem = S.rem || { on: true, days: [1, 3, 5], time: "18:00" }; const i = +d.d; r.days = r.days.includes(i) ? r.days.filter(x => x !== i) : [...r.days, i].sort(); save(); render(); break; }
    case "disc": { const k = dayKey(Date.now()); const x = S.disc[k] = S.disc[k] || {}; x[d.k] = !x[d.k]; save(); render(); break; }
    case "rmjournal": confirmBox("Delete journal entry?", "This can't be undone.", "Delete", () => { S.journal = S.journal.filter(j => j.id !== d.id); save(); closeOverlay(); render(); }); break;
    case "faith-on": S.faith = true; save(); render(); break;
    case "faith": S.faith = d.on === "1"; save(); render(); break;
    case "units": S.units = d.u; save(); render(); break;
    case "ask": sendChat(d.q); break;
    case "stop": if (coachBusy) coachBusy.abort(); break;
    case "clearchat": S.chat = []; save(); render(); break;
    case "reset": confirmBox(d.mode === "seed" ? "Reload sample data?" : "Start fresh?", "This replaces everything saved in this preview: workouts, bodyweight, meals, journal and chat.", d.mode === "seed" ? "Reload" : "Erase everything", () => { if (d.mode === "seed") seed(); else { S = blank(); save(); } stack.length = 0; closeOverlay(); go(d.mode === "seed" ? "home" : "welcome", {}, false); toast(d.mode === "seed" ? "Sample data reloaded." : "All preview data erased."); }); break;
  }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.search === "ex") { R.p.q = t.value; $("exlist").innerHTML = exRows(t.value); return; }
  if (t.dataset.b && BS) {
    const v = t.value; BS.preview = null;
    if (t.dataset.b === "age") BS.age = v;
    else if (t.dataset.b === "w") BS.kg = fromDisp(parseFloat(v) || 0);
    else if (t.dataset.b === "cm") BS.heightCm = parseFloat(v) || 0;
    else if (t.dataset.b === "ft" || t.dataset.b === "in") { const ft = parseFloat(document.querySelector('[data-b="ft"]').value) || 0, inch = parseFloat(document.querySelector('[data-b="in"]').value) || 0; BS.heightCm = round((ft * 12 + inch) * 2.54, 1); }
    else if (t.dataset.b === "cmin") BS.cardio.continuousMinutes = Math.max(0, Math.min(240, parseInt(v, 10) || 0));
    else if (["days", "minutes", "weeks"].includes(t.dataset.b)) BS[t.dataset.b] = parseInt(v, 10);
    return;
  }
  if (t.dataset.lift && BS) {
    const l = t.dataset.lift; BS.lifts[l] = { ...(BS.lifts[l] || {}), [t.dataset.f]: t.value }; BS.preview = null;
    const v = BS.lifts[l], el = document.querySelector(`[data-est="${l}"]`);
    if (el) el.textContent = (BS.mode[l] === "set" && +v.w > 0 && +v.r > 0) ? `Estimated 1RM ≈ ${Math.round(toDisp(e1rm(fromDisp(+v.w), Math.min(+v.r, 12))))} ${unit()} (Epley formula)` : "";
    return;
  }
  if (t.dataset.remTime !== undefined) { S.rem = S.rem || { on: true, days: [1, 3, 5], time: "18:00" }; S.rem.time = t.value || "18:00"; save(); return; }
  if (t.dataset.su && SU) { SU[t.dataset.su] = t.value; return; }
  if (t.dataset.fit !== undefined && FS) { FS.fit = t.checked; $("foodlist").innerHTML = foodListHtml(FS.q); return; }
  if (t.dataset.search === "food") { if (FS) FS.q = t.value; $("foodlist").innerHTML = foodListHtml(t.value); return; }
  if (t.dataset.search === "pick") { $("picklist").innerHTML = pickerRows(t.value, "add-to"); return; }
  const k = t.dataset.in; if (!k || !S.draft) return;
  if (k === "notes") { S.draft.notes = t.value.slice(0, 2000); save(); return; }
  const s = S.draft.ex[+t.dataset.ei].sets[+t.dataset.si];
  const v = parseFloat(t.value.replace(",", "."));
  if (k === "w") s.w = isFinite(v) && v > 0 ? fromDisp(Math.min(v, 2000)) : 0;
  else if (k === "r") s.r = isFinite(v) && v > 0 ? Math.min(Math.round(v), 500) : 0;
  else if (k === "sec") s.sec = isFinite(v) && v > 0 ? Math.min(Math.round(v), 7200) : 0;
  save();
});
document.addEventListener("submit", ev => {
  const f = ev.target; const kind = f.dataset.form; if (!kind) return;
  ev.preventDefault();
  const fd = new FormData(f);
  const num = n => { const v = parseFloat(String(fd.get(n) || "").replace(",", ".")); return isFinite(v) && v >= 0 ? v : 0; };
  if (kind === "bw") {
    const v = num("v"); const kg = fromDisp(v);
    if (kg < 25 || kg > 350) { toast(`Enter a bodyweight between ${toDisp(25)} and ${toDisp(350)} ${unit()}.`); return; }
    const today = startOfDay(Date.now());
    S.bw = S.bw.filter(b => startOfDay(b.t) !== today); S.bw.push({ t: Date.now(), kg }); S.bw.sort((a, b) => a.t - b.t);
    save(); render(); toast("Bodyweight logged.");
  } else if (kind === "food") {
    const n = String(fd.get("n") || "").trim().slice(0, 80); if (!n || !FS) return;
    const base = { n, serving: String(fd.get("serving") || "").trim().slice(0, 40), kcal: Math.round(Math.min(num("kcal"), 5000)), p: Math.round(Math.min(num("p"), 500)), c: Math.round(Math.min(num("c"), 1000)), f: Math.round(Math.min(num("f"), 500)) };
    if (fd.get("keep") && !S.myFoods.some(x => x.n.toLowerCase() === n.toLowerCase())) S.myFoods.push({ id: uid(), ...base });
    logFood({ ...base, qty: 1, base });
    FS.tab = "search"; FS.q = ""; openSheet(foodSheet());
  } else if (kind === "welcome") {
    go("signup", { email: String(fd.get("email") || "").trim().slice(0, 254) });
  } else if (kind === "signup") {
    const name = String(fd.get("name") || "").trim().slice(0, 40), email = String(fd.get("email") || "").trim(), pw = String(fd.get("password") || "");
    if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("Enter your name and a valid email."); return; }
    if (pw.length < 8) { toast("Use a password with at least 8 characters."); return; }
    if (!fd.get("adult")) { toast("Narrow Gate Fitness is for adults (18+)."); return; }
    S.name = name; S.email = email; save(); newSetup(); SU.name = name; go("setup", {}, false);
  } else if (kind === "checkin") {
    const dn = +f.dataset.d; if (!S.ch) return;
    S.ch.checks[dn] = { read: !!fd.get("read"), trained: !!fd.get("trained"), note: String(fd.get("note") || "").slice(0, 1000) };
    const all = Array.from({ length: 40 }, (_, i) => chDone(i + 1)).every(Boolean);
    if (all && !S.ch.completed) { S.ch.completed = true; confetti(160); }
    save(); closeOverlay(); render();
    toast(chDone(dn) ? `Day ${dn} complete.` : `Day ${dn} saved. Tick both boxes to complete it.`);
  } else if (kind === "barcode") {
    const code = String(fd.get("code") || "").replace(/\D/g, "");
    if (!validBarcode(code)) { const box = $("scanres"); if (box) box.innerHTML = `<p class="small" style="color:#f0a69b">That doesn't look like a valid barcode (8, 12 or 13 digits). Check the numbers under the bars.</p>`; return; }
    lookupBarcode(code);
  } else if (kind === "journal") {
    const text = String(fd.get("text") || "").trim(); if (!text) return;
    S.journal.push({ id: uid(), t: Date.now(), text: text.slice(0, 2000) }); save(); render(); toast("Journal entry saved.");
  } else if (kind === "profile") {
    S.name = String(fd.get("name") || "").trim().slice(0, 40) || "Athlete"; S.goal = String(fd.get("goal") || "build_strength");
    save(); render(); toast("Profile saved.");
  } else if (kind === "chat") {
    const q = String(fd.get("q") || ""); sendChat(q);
  }
});
document.addEventListener("change", async ev => {
  const t = ev.target; if (!t.matches || !t.matches("[data-photo-input]") || !t.files || !t.files[0]) return;
  try {
    const src = await downscale(t.files[0]);
    PHOTOS.push({ id: uid(), t: Date.now(), pose: "front", note: "", src });
    if (!savePhotos()) { PHOTOS.pop(); toast("This browser's storage is full. Delete an older photo first."); return; }
    render(); toast("Photo added. Only you can see it.");
  } catch (_) { toast("That file couldn't be read as an image."); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $("overlay").innerHTML) closeOverlay();
  if (ev.key === "Enter" && !ev.shiftKey && ev.target.id === "chatq") { ev.preventDefault(); ev.target.form.requestSubmit(); }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawCharts, 120); });

/* Timers: workout clock + rest countdown */
setInterval(() => {
  const D = S.draft; if (!D) return;
  const el = $("elapsed"); if (el) el.textContent = fmtDur((Date.now() - D.start) / 1000);
  if (D.rest) {
    const left = Math.ceil((D.rest.end - Date.now()) / 1000);
    if (left <= 0) { D.rest = null; save(); renderRest(); if (R.v === "logger") toast("Rest's over. Next set!"); if (navigator.vibrate) { try { navigator.vibrate([80, 60, 80]); } catch (_) { } } }
    else { const c = $("restclock"); if (c) c.textContent = fmtDur(left); }
  }
}, 250);

/* Boot */
S = load();
if (!S) { S = blank(); R = { v: "welcome", p: {} }; }
if (!Array.isArray(S.myFoods)) S.myFoods = [];
registerCustom();
render();
getSample().then(() => { if (R.v === "coach") render(); });
})();
</script>
