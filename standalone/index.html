nder control to the chest or lap."],"q":["Elbows up in the rack","Dip straight down, drive straight up","Head through at lockout"],"m":["Pressing from a poor rack with elbows down","Leaning back excessively","Dropping the log from overhead onto the body"],"a":["push-press","overhead-press","landmine-press"],"pt":"vertical_push","li":0},{"s":"yoke-carry","n":"Yoke Carry","p":["upper back","core","quadriceps"],"e":["strongman_implements"],"c":"strength","d":"advanced","t":1,"ds":"Carrying a loaded yoke frame on your upper back over a set distance — heavy bracing under load with fast, short steps.","i":["Set the yoke crossbar at upper-back height and get under it as for a back squat.","Grip the uprights, brace hard and stand the yoke up.","Walk with short, quick steps, keeping the yoke level and your eyes forward.","Set it down under control at the end of the distance or if it begins to swing."],"q":["Short, fast steps","Brace like a heavy squat","Push up into the bar"],"m":["Long strides that make the yoke swing","Looking down","Losing the brace mid-run"],"a":["farmers-carry","sandbag-bear-hug-carry","sled-push"],"pt":"carry","li":0},{"s":"atlas-stone-load","n":"Atlas Stone Load","p":["glutes","hamstrings","spinal erectors"],"e":["strongman_implements"],"c":"strength","d":"advanced","t":0,"ds":"Lifting a round stone from the floor to the lap and then onto a platform or over a bar. Use tacky only where permitted and start light.","i":["Stand over the stone with feet wide, reach down and wrap your arms and fingers around it.","Lift the stone to your lap by extending the hips, sitting back slightly to cradle it.","Re-grip high on the stone, then drive the hips forward and extend upward to roll it onto the platform.","Step back and lower the stone under control or let it roll off the platform away from your feet."],"q":["Hug the stone tight to your body","Lap, re-grip, extend","Hips through to finish"],"m":["Trying to lift the stone with straight arms only","Feet too narr "n":"Women's Strength Training"},{"s":"active-aging","n":"Active Aging & Low-Impact"},{"s":"home-workouts","n":"Home Workouts"},{"s":"mobility-flexibility","n":"Mobility & Flexibility"},{"s":"recovery-deload","n":"Recovery & Deload"}],"sc":[{"r":"Matthew 7:13–14","t":"Enter ye in at the strait gate: for wide is the gate, and broad is the way, that leadeth to destruction, and many there be which go in thereat: Because strait is the gate, and narrow is the way, which leadeth unto life, and few there be that find it.","th":["discipline","perseverance"],"rf":"The narrow way is rarely the easy one. Where in your training or life are you tempted to take the broad, comfortable path today?"},{"r":"1 Corinthians 9:24–25","t":"Know ye not that they which run in a race run all, but one receiveth the prize? So run, that ye may obtain. And every man that striveth for the mastery is temperate in all things. Now they do it to obtain a corruptible crown; but we an incorruptible.","th":["discipline","self_control"],"rf":"Athletes practise temperance for a fading prize. What lasting prize shapes how you train and live?"},{"r":"1 Timothy 4:8","t":"For bodily exercise profiteth little: but godliness is profitable unto all things, having promise of the life that now is, and of that which is to come.","th":["stewardship","humility"],"rf":"Training has real value, yet it is not the highest value. How can your training serve something greater?"},{"r":"Hebrews 12:1","t":"Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,","th":["perseverance"],"rf":"What weight could you lay aside this week to run your race with more patience?"},{"r":"Galatians 6:9","t":"And let us not be weary in well doing: for in due season we shall reap, if we faint not.","th":["perseverance"],"rf":"Progress often feels invisible. Which small, faithful habit will you keep even when results feel slow?"},{"r":"Isaiah 40:31","t":"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","th":["perseverance","humility"],"rf":"Strength is renewed, not only built. How are you making space for rest and renewal?"},{"r":"Proverbs 16:32","t":"He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.","th":["self_control"],"rf":"Ruling your own spirit is a greater feat than any lift. Where can you practise self-control today?"},{"r":"Proverbs 25:28","t":"He that hath no rule over his own spirit is like a city that is broken down, and without walls.","th":["self_control","discipline"],"rf":"Discipline builds walls that protect what matters. Which boundary would serve you well this week?"},{"r":"1 Corinthians 6:19–20","t":"What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own? For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God's.","th":["stewardship"],"rf":"Caring for your body can be an act of stewardship, not vanity. What does faithful care look like for you right now?"},{"r":"James 4:10","t":"Humble yourselves in the sight of the Lord, and he shall lift you up.","th":["humility"],"rf":"Humility in training means honest loads, honest effort and honest rest. Where does ego need to step aside?"},{"r":"Micah 6:8","t":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","th":["humility"],"rf":"How can the strength you build be used to serve others with justice and mercy?"},{"r":"1 Peter 4:10","t":"As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God.","th":["stewardship","gratitude"],"rf":"What gift — health, time, encouragement — can you steward for someone else this week?"},{"r":"Galatians 5:22–23","t":"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law.","th":["self_control","humility"],"rf":"Temperance appears alongside love and joy. Which of these fruits do you most want to grow?"},{"r":"2 Timothy 1:7","t":"For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.","th":["discipline","perseverance"],"rf":"A sound mind is a disciplined mind. What fear is holding back your next step?"},{"r":"Colossians 3:23","t":"And whatsoever ye do, do it heartily, as to the Lord, and not unto men;","th":["discipline","stewardship"],"rf":"Train and work wholeheartedly — not for applause. What would 'heartily' look like in today's session?"},{"r":"Philippians 3:13–14","t":"Brethren, I count not myself to have apprehended: but this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before, I press toward the mark for the prize of the high calling of God in Christ Jesus.","th":["perseverance","humility"],"rf":"Yesterday's missed workout doesn't define today. What will you press toward next?"},{"r":"Romans 5:3–4","t":"And not only so, but we glory in tribulations also: knowing that tribulation worketh patience; And patience, experience; and experience, hope:","th":["perseverance"],"rf":"Difficulty can produce patience and hope. What hard thing is shaping you right now?"},{"r":"Psalm 118:24","t":"This is the day which the LORD hath made; we will rejoice and be glad in it.","th":["gratitude"],"rf":"Name three things your body allowed you to do today that you're grateful for."}],"fd":[["chicken-breast-cooked","Chicken breast, skinless, cooked","protein",4,"oz (113 g)",187,35,0,4],["chicken-thigh-cooked","Chicken thigh, skinless, cooked","protein",4,"oz (113 g)",229,28,0,12],[" Cola","drinks",12,"fl oz can (355 ml)",140,0,39,0],["chocolate-milk","Chocolate milk, low-fat","drinks",1,"cup (250 ml)",190,8,30,5],["cheese-pizza-slice","Cheese pizza, regular crust","meals",1,"slice (107 g)",285,12,36,10],["cheeseburger","Cheeseburger, single patty","meals",1,"burger (150 g)",350,18,33,16],["burrito-bowl-chicken","Chicken burrito bowl (rice, beans, salsa)","meals",1,"bowl",650,45,75,18],["grilled-chicken-salad","Grilled chicken salad, light dressing","meals",1,"salad",380,35,15,20],["turkey-sandwich","Turkey sandwich on wheat","meals",1,"sandwich",360,25,40,11],["spaghetti-meat-sauce","Spaghetti with meat sauce","meals",1.5,"cups (370 g)",480,25,60,15],["chicken-stir-fry","Chicken stir-fry with rice","meals",1,"plate",550,35,65,15]],"dv":[{"d":1,"t":"The Narrow Gate","r":"Matthew 7:13–14","s":"Enter ye in at the strait gate: for wide is the gate, and broad is the way, that leadeth to destruction, and many there be which go in thereat: Because strait is the gate, and narrow is the way, which leadeth unto life, and few there be that find it.","v":"Jesus spoke of two roads. One is wide and crowded, and it asks nothing of us. The other begins at a narrow gate, and few find it. He was speaking first of life with God, not of exercise, yet the shape of His words echoes through every ordinary choice. The broad way is usually the path of least resistance: the snooze button, the skipped session, the habit we keep meaning to change. The narrow way asks us to choose what is good even when it is not easy. As you begin these forty days, hear this clearly: you are not walking through the gate to earn God's love. That love is already offered freely in Christ. You are choosing to walk in step with Him, one faithful day at a time. Start small. Start honestly. Ask Him for grace to take today's step, and trust Him with the rest of the road.","p":"Lord, thank You for inviting me onto the narrow way; give me grace to take today's step with You.","tr":"Complete today's scheduled workout. If it's a rest day: a 20-minute walk and 10 minutes of mobility.","q":"Where in your life are you most tempted to take the broad, easy path right now?"},{"d":2,"t":"Not of Works","r":"Ephesians 2:8–9","s":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast.","v":"Before you log a single rep in this challenge, settle this: nothing you do over the next forty days will make God love you more, and nothing you miss will make Him love you less. Paul writes that salvation is a gift received through faith, not a reward for effort, so that no one can boast. That truth frees us. Discipline that grows out of fear quickly turns into pride when we succeed and shame when we fail. Discipline that grows out of grace is different. It says, \"I have been loved and welcomed, so I want to steward this life well.\" Training becomes an act of gratitude rather than a way to prove ourselves. Today, as you move your body, let each effort be a quiet thank-you. And if you fall short, remember that grace was never earned to begin with, so it cannot be lost by a missed day.","p":"Father, thank You that Your grace is a gift; let my effort today flow from gratitude, not from fear.","tr":"Complete today's scheduled workout. If it's a rest day: a 20-minute walk, giving thanks for each good thing you notice along the way.","q":"Do you tend to train from a place of fear and proving, or from gratitude? What would change if it were gratitude?"},{"d":3,"t":"New Every Morning","r":"Lamentations 3:22–23","s":"It is of the LORD's mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.","v":"Lamentations was written in the rubble of a ruined city. Its author had every reason to despair, yet in the middle of his grief he remembered something steady: the Lord's compassions do not fail, and His mercies are new every morning. Most fitness journeys stall not because of one bad day but because of what we tell ourselves afterward: \"I've already blown it, so why bother?\" Mercy breaks that cycle. Each morning is a genuine fresh start, not because we have earned it but because God is faithful. Yesterday's missed workout, poor meal or late night does not have to set the tone for today. You do not need to make up for it with punishment. You simply begin again. Receive this morning as a gift, and let His faithfulness, rather than your track record, be the thing you lean on.","p":"Lord, thank You that Your mercies are new this morning; help me begin again without shame.","tr":"Complete today's scheduled workout. If it's a rest day: 10 minutes of easy mobility first thing in the morning and a 20-minute walk later.","q":"What would it look like to treat today as a genuine fresh start rather than a continuation of yesterday?"},{"d":4,"t":"Faithful in Little","r":"Luke 16:10","s":"He that is faithful in that which is least is faithful also in much: and he that is unjust in the least is unjust also in much.","v":"Jesus said that whoever is faithful in very little is faithful also in much. We often wait for big moments to prove our commitment, but character is mostly formed in small, unseen choices. Strength works the same way. No single workout transforms you. What changes you is the steady accumulation of ordinary sessions, glasses of water, early bedtimes and honest reps that nobody else notices. That can feel unglamorous, but there is something holy in it. God sees the little things, and He delights in faithfulness more than in flash. Today, look for one small thing you can do well: warm up properly, finish the last set with good form, put your phone away at dinner, or go to bed on time. Do it quietly and wholeheartedly, as an offering rather than a performance. Small faithfulness, repeated over many days, becomes a life.","p":"Lord, teach me to be faithful in the small things You have placed in front of me today.","tr":"Complete today's scheduled workout and give extra care to your warm-up and form. Rest day: a 15-minute walk and 10 minutes of stretching.","q":"Which small, unseen habit would make the biggest difference if you kept it faithfully?"},{"d":5,"t":"Run That Ye May Obtain","r":"1 Corinthians 9:24–25","s":"Know ye not that they which run in a race run all, but one receiveth the prize? So run, that ye may obtain. And every man that striveth for the mastery is temperate in all things. Now they do it to obtain a corruptible crown; but we an incorruptible.","v":"Paul lived in a culture that loved athletics. The Isthmian Games were held near Corinth, and his readers knew how hard competitors trained for a wreath of leaves that would wither within days. He uses that picture to ask a searching question: if athletes are temperate in all things for a fading prize, how much more should we live with purpose for one that never fades? Temperance here does not mean grim restriction. It means ordering our desires so that the good things in life serve what matters most. Your training has real value, and so do rest, food and friendship. The question is whether they are pointed somewhere. Today, run your race with focus. Train with intention, eat with gratitude, and remember that the deepest prize is not a number on a scale or a bar, but a life that honours God.","p":"Lord, order my desires today so that everything I do points toward You.","tr":"Complete today's scheduled workout with one clear focus for each exercise. Rest day: a 20-minute brisk walk and 10 minutes of mobility.","q":"What is the \"prize\" that actually motivates your training, and is it one that lasts?"},{"d":6,"t":"Sufficient Unto the Day","r":"Matthew 6:34","s":"Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.","v":"Forty days can feel long on day six. It is tempting to look ahead and count how much is left, or to worry about the busy week coming and whether you will keep up. Jesus speaks gently into that habit: do not be anxious about tomorrow, for tomorrow will take care of itself. Each day already has enough in it. This is not a call to carelessness. Planning your training is wise. But anxiety about the future steals the strength you need for the present. God gives grace for today, not for next Thursday. So narrow your focus. What does faithfulness look like in the next twenty-four hours? One devotional. One session or one walk. One good meal. One reasonable bedtime. That is enough. Tomorrow will bring its own grace when it arrives, and the same faithful God will be there to meet you in it.","p":"Father, I give You my worries about tomorrow; help me be faithful with today.","tr":"Complete today's scheduled workout without thinking past it. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"What worry about the future is draining energy you need for today?"},{"d":7,"t":"Go to the Ant","r":"Proverbs 6:6","s":"Go to the ant, thou sluggard; consider her ways, and be wise:","v":"Proverbs sends the sluggard to an unlikely teacher: the ant. The verses that follow note that the ant has no guide or ruler standing over her, yet she gathers her food in season. Ants are not dramatic. They do not wait to feel inspired. They simply do the next necessary thing, day after day, and the colony thrives. Motivation is a wonderful feeling, but it is unreliable. Some mornings you will wake up eager to train, and many mornings you will not. Wisdom is building rhythms that carry you when feelings fade: laying out your clothes the night before, scheduling your session like an appointment, keeping the first step small. One week into this challenge, consider the ant. Not because hustle makes you worthy, but because steady, humble diligence is a gift you give your future self and the people who depend on you.","p":"Lord, give me the wisdom to build steady rhythms that serve me when motivation fades.","tr":"Complete today's scheduled workout, then set out what you need for your next session. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"What simple rhythm could carry you on days when you don't feel motivated?"},{"d":8,"t":"A Sound Mind","r":"2 Timothy 1:7","s":"For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.","v":"Paul reminded young Timothy that God has not given us a spirit of fear, but of power, of love and of a sound mind. Fear shows up in training more than we admit: fear of looking foolish at the gym, fear of failing a lift, fear of starting again after a long break, fear that we will never change. Fear shrinks our world. The Spirit enlarges it. Notice the three gifts Paul names. Power is the courage to begin. Love keeps our goals pointed outward, toward God and others. A sound mind brings self-discipline and good judgement, which means training wisely, respecting pain signals and resting when needed. Courage is not recklessness. Today, name one fear that has been holding you back, and take one sensible step past it, trusting that you do not take it alone.","p":"Holy Spirit, replace my fear with power, love and a sound mind as I take today's step.","tr":"Complete today's scheduled workout, and sensibly try one exercise you've been hesitant about, with good form. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Which fear has been quietly shaping your choices about your health?"},{"d":9,"t":"Be Strong and of a Good Courage","r":"Joshua 1:9","s":"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.","v":"Joshua stood at the edge of the promised land with an enormous task ahead and a legendary leader behind him. Moses was gone, and the people were looking to Joshua. God's command was not \"be impressive\" but \"be strong and of a good courage\", and the reason was not Joshua's ability. It was God's presence: the Lord your God is with you wherever you go. Strength in Scripture is rarely self-made. It is courage rooted in the faithfulness of Someone else. That matters when you face something daunting, whether a new program, a health diagnosis, or simply the long middle stretch of a challenge like this one. You are not asked to manufacture confidence. You are invited to step forward because you are accompanied. Whatever feels like a river to cross today, God goes before you and walks beside you as you go.","p":"Lord, thank You that You go with me; give me courage for the task in front of me today.","tr":"Complete today's scheduled workout. Rest day: a 20-minute walk somewhere new and 10 minutes of mobility.","q":"What daunting task would look different if you truly believed God was with you in it?"},{"d":10,"t":"Commit Thy Works","r":"Proverbs 16:3","s":"Commit thy works unto the LORD, and thy thoughts shall be established.","v":"Ten days in, it is a good moment to pause and hand your plans back to God. The Hebrew word behind \"commit\" carries the picture of rolling something onto someone else, like shifting a heavy load onto stronger shoulders. We tend to grip our goals tightly. We want control over the results: the weight lost, the strength gained, the streak kept. But results are not fully in our hands. Injuries happen. Seasons change. Bodies respond differently. What we can do is offer our efforts honestly and let God shape the outcome. This brings a surprising steadiness. When your training is committed to Him, a setback is not a catastrophe and a success is not a cause for pride. Both become occasions to trust. Before you train today, offer Him your plans for the next thirty days, and leave the results in His hands.","p":"Lord, I commit my plans and efforts to You; establish my thoughts and hold my results in Your hands.","tr":"Complete today's scheduled workout, beginning with a brief prayer over your session. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Which result are you gripping too tightly, and what would it mean to commit it to God?"},{"d":11,"t":"Be Not Weary in Well Doing","r":"Galatians 6:9","s":"And let us not be weary in well doing: for in due season we shall reap, if we faint not.","v":"Paul's encouragement is honest: we will be tempted to grow weary. Doing good, whether serving others, keeping our word or caring for our bodies, can feel slow and unrewarded. The harvest picture helps. A farmer plants seeds, waters them and waits. For weeks there is nothing to see above the soil, yet something is happening underneath. Training often feels like that. Strength and endurance build quietly, and the mirror or the scale rarely tells the whole story. Paul's promise is that in due season we shall reap, if we faint not. The season is God's, not ours. Our part is to keep sowing. If you are tired today, that is not failure; it is part of the process. Rest if you need rest. But do not quit on something good just because you cannot yet see the harvest.","p":"Lord, strengthen me when I am weary, and help me keep sowing what is good.","tr":"Complete today's scheduled workout, scaling it down if you need to. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Where are you tempted to give up on something good because the results feel slow?"},{"d":12,"t":"The Peaceable Fruit","r":"Hebrews 12:11","s":"Now no chastening for the present seemeth to be joyous, but grievous: nevertheless afterward it yieldeth the peaceable fruit of righteousness unto them which are exercised thereby.","v":"Hebrews is honest about discipline: no chastening seems joyous in the moment, but grievous. The writer is describing the way God trains His children, and the word translated \"exercised\" comes from the same Greek root that gives us \"gymnasium\". God's discipline is not punishment for its own sake. It is training, the patient work of a loving Father shaping us toward peace and righteousness. Anyone who has trained their body knows the pattern. The last reps burn. The early alarm is unwelcome. Yet afterward comes a fruit that could not have been gathered any other way. The same is often true of the harder lessons God allows in our lives. They are rarely pleasant, but they are not purposeless. Today, when something is uncomfortable, whether a set, a conversation or a craving, ask what fruit this training might produce.","p":"Father, thank You for training me in love; help me trust Your purpose when it is hard.","tr":"Complete today's scheduled workout and finish the final set with your best form. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"What uncomfortable season in your life might God be using to train you?"},{"d":13,"t":"Let Patience Have Her Perfect Work","r":"James 1:2–4","s":"My brethren, count it all joy when ye fall into divers temptations; Knowing this, that the trying of your faith worketh patience. But let patience have her perfect work, that ye may be perfect and entire, wanting nothing.","v":"James begins his letter with a startling instruction: count it all joy when you meet various trials. He is not asking us to pretend hardship feels good. He is pointing to what it produces. The testing of faith works patience, and patience, given time, makes us mature and complete. Strength coaches talk about progressive overload: muscles grow because they are challenged a little beyond what is comfortable, then given time to adapt. James describes something similar in the soul. Trials are the load; patience is the adaptation. The key phrase is \"let patience have her perfect work.\" We often want to rush the process or escape it. Today, whatever is stretching you, from a stalled lift to a strained relationship, try not to run from it. Let patience do its work, and trust God to finish what He has started.","p":"Lord, help me let patience do its full work in me, and give me joy in the process.","tr":"Complete today's scheduled workout; if progress has stalled, focus on clean technique rather than more weight. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"What trial are you trying to rush through that might be building patience in you?"},{"d":14,"t":"Tribulation Worketh Patience","r":"Romans 5:3–4","s":"And not only so, but we glory in tribulations also: knowing that tribulation worketh patience; And patience, experience; and experience, hope:","v":"Paul links a chain together: tribulation produces patience, patience produces experience, a word that can also be translated as proven character, and experience produces hope. Hard things, received in faith, do not leave us empty. They leave us tested and hopeful. Two weeks into a challenge, many people hit a wall. The novelty has worn off, life has interrupted, and the finish line still feels far away. This is exactly where character is formed. Anyone can start; perseverance happens in the middle. If you have missed days, catch up gently and keep going. If you are on track, stay humble and steady. Either way, the hope Paul describes is not wishful thinking about your fitness. It rests on God's love, which he says in the very next verse is shed abroad in our hearts by the Holy Ghost.","p":"Lord, use the hard parts of this season to build patience, character and hope in me.","tr":"Complete today's scheduled workout. If you've missed days, catch up on one devotional too. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Looking back, how has a past hardship shaped your character for good?"},{"d":15,"t":"He That Ruleth His Spirit","r":"Proverbs 16:32","s":"He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.","v":"Proverbs makes a bold comparison: the person who rules their own spirit is greater than the one who captures a city. We celebrate visible victories, such as a new personal record, a race finished or a dramatic photo. Scripture values something less visible but more difficult: mastery of our own impulses, temper and appetites. Self-control is not about crushing every desire or living in fear of every indulgence. It is about not being ruled by them. It is the ability to pause, to choose, and to say yes to what is better. In training, it looks like stopping a set when form breaks down, choosing rest over ego, or walking away from comparison. In life, it looks like a gentle answer instead of an angry one. Today, practise ruling your spirit in one specific moment, and ask the Spirit to help you.","p":"Holy Spirit, grow self-control in me, and help me choose what is better in the moments that test me.","tr":"Complete today's scheduled workout, ending each set when your form starts to break down. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"In what situation do you most need to rule your spirit this week?"},{"d":16,"t":"A City With Walls","r":"Proverbs 25:28","s":"He that hath no rule over his own spirit is like a city that is broken down, and without walls.","v":"In the ancient world, a city without walls was exposed to every raider and every storm. Proverbs says a person without rule over their own spirit is like that city: broken down and defenceless. Healthy boundaries are not prison bars. They are walls that protect what is valuable. A bedtime protects your sleep. A planned meal protects you from grazing out of stress. A firm \"no\" to some commitments protects your ability to give a wholehearted \"yes\" to others. Many people resist boundaries because they feel restrictive. But a life without them is not freer; it is more vulnerable. Think about the gates in your own walls. Where do things slip in that wear you down? Late-night scrolling, constant snacking, an overloaded calendar? Today, rebuild one small section of the wall by choosing one boundary that would protect your health and peace.","p":"Lord, help me build wise boundaries that protect what You have entrusted to me.","tr":"Complete today's scheduled workout, then set one boundary for tonight, such as a screen-off time. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Which boundary, if you kept it, would most protect your health and peace?"},{"d":17,"t":"The Fruit of the Spirit","r":"Galatians 5:22–23","s":"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law.","v":"The fruit of the Spirit is a single fruit with many flavours: love, joy, peace, longsuffering, gentleness, goodness, faith, meekness and temperance. Notice that temperance, or self-control, comes at the end of a list that begins with love. That order matters. Self-control grown apart from love can become harsh, proud or anxious. Self-control that grows from the Spirit is gentle and joyful. Notice also that these are fruit, not achievements. Fruit grows when a branch stays connected to the vine. We do not manufacture patience or peace by sheer effort; we cultivate the conditions in which God grows them, through prayer, Scripture, community and obedience. Today, as you train, pay attention to the spirit in which you do it. Is there joy? Gentleness with yourself? Peace instead of frantic striving? Invite the Spirit to grow His fruit in you.","p":"Holy Spirit, grow Your fruit in me today, beginning with love.","tr":"Complete today's scheduled workout with a calm, unhurried mindset. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Which fruit of the Spirit do you most want to see grow in you over the next few weeks?"},{"d":18,"t":"Pressing Toward the Mark","r":"Philippians 3:13–14","s":"Brethren, I count not myself to have apprehended: but this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before, I press toward the mark for the prize of the high calling of God in Christ Jesus.","v":"Paul, late in his ministry, says he has not yet arrived. Instead, he does one thing: forgetting what is behind and reaching toward what is ahead, he presses on toward the prize of God's high calling in Christ. Forgetting the past does not mean pretending it never happened. It means refusing to let it define us, whether past failures that weigh us down or past successes that make us complacent. Many of us carry an old version of ourselves into every workout. \"I used to be stronger.\" \"I've never been athletic.\" \"I always quit.\" Paul invites us to set those stories down. The mark is ahead, not behind. Nearly halfway through this challenge, where you have been matters less than the direction you are facing. Lean forward today, and take the next step toward the calling God has placed on your life.","p":"Lord, help me release what is behind and press on toward the calling You have for me.","tr":"Complete today's scheduled workout without comparing yourself to a past version of you. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"What old story about yourself do you need to stop carrying into today?"},{"d":19,"t":"Heartily, as to the Lord","r":"Colossians 3:23","s":"And whatsoever ye do, do it heartily, as to the Lord, and not unto men;","v":"Paul first wrote these words to servants doing unglamorous, often unnoticed work. His counsel was to do it heartily, as to the Lord and not to men. That changes the audience of everything we do. When we train for applause, our motivation rises and falls with attention. When we train as an offering to God, even an unobserved session matters. Heartily does not mean frantically or perfectly. It means wholeheartedly, with presence and care. It might look like giving full attention to a warm-up instead of rushing through it, or bringing a good attitude to a workout you would rather skip. The same applies to your job, your chores and your relationships. Today, choose one task you usually do half-heartedly and do it as if Jesus were your only audience. Notice how that changes the experience, and how it changes you.","p":"Lord, let my work and training today be wholehearted offerings to You.","tr":"Complete today's scheduled workout, giving full attention to each set. Rest day: a 20-minute walk and 10 minutes of mobility, without your phone.","q":"Whose approval are you most often training or working for?"},{"d":20,"t":"Strength Made Perfect in Weakness","r":"2 Corinthians 12:9","s":"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.","v":"Halfway through this challenge, you may be more aware of your limits than when you started: tight hips, a tired body, a busy schedule, a stubborn habit. Paul knew limits too. He asked God three times to remove a thorn in the flesh, and God's answer was not removal but grace: \"My grace is sufficient for thee: for my strength is made perfect in weakness.\" This is a different kind of strength from the gym. It does not deny weakness or push recklessly through pain. It brings weakness honestly to God and finds Him enough. If you are injured, ill or limited, your part in this challenge is not lesser. Adapt your training, rest when you need to, and seek good medical advice. God is not waiting for you to become strong before He works. His power rests on those who know they need Him.","p":"Lord, I bring You my weakness today; let Your grace be sufficient for me.","tr":"Complete today's scheduled workout, adapting anything that hurts. Rest day, or managing an injury: gentle mobility in a pain-free range and a short walk if comfortable.","q":"What weakness or limitation do you need to bring honestly to God instead of hiding?"},{"d":21,"t":"The Temple of the Holy Ghost","r":"1 Corinthians 6:19–20","s":"What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own? For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God's.","v":"Paul tells the Corinthians that their bodies are temples of the Holy Ghost, and that they are not their own; they were bought with a price. In a culture that both indulged and despised the body, this was radical. The body is not a prison to escape or an idol to perfect. It is a dwelling place for God's Spirit, purchased through Christ's sacrifice. This changes why we care for it. Not to earn approval, chase an ideal image or compete with others, but to honour the One who lives in us and to have strength to serve. Stewardship includes training, but also sleep, nourishment, medical care, rest and refusing to harm our bodies through neglect or extremes. Today, think of your body with gratitude rather than criticism. It is not a project to perfect; it is a gift entrusted to you.","p":"Lord, thank You for the gift of this body; help me care for it as Your dwelling place.","tr":"Complete today's scheduled workout, then drink a full glass of water and thank God for something your body did today. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"How does seeing your body as a temple, rather than a project, change how you care for it?"},{"d":22,"t":"A Living Sacrifice","r":"Romans 12:1","s":"I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service.","v":"After eleven chapters describing God's mercy, Paul finally urges a response: present your bodies a living sacrifice, holy and acceptable to God, which is your reasonable service. Notice the order. Mercy comes first; offering follows. We do not give ourselves to God to obtain His mercy; we give ourselves because we have already received it. And Paul says bodies, not just hearts or minds. Faith is lived out in physical, everyday actions: where our feet go, what our hands do, how we spend our energy. A living sacrifice is not consumed in a single dramatic moment. It is offered daily in ordinary ways. Getting up to train, preparing a nourishing meal, resting when you are depleted and using your strength to help someone can all be worship when offered to God. Today, consciously offer your body and your day to God before you begin anything else.","p":"Lord, in view of Your mercy, I offer You my body and my day as a living sacrifice.","tr":"Complete today's scheduled workout, starting with a short prayer offering it to God. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"What ordinary action today could become an act of worship?"},{"d":23,"t":"Fearfully and Wonderfully Made","r":"Psalm 139:14","s":"I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.","v":"David marvels at how God formed him: \"I am fearfully and wonderfully made.\" It is worth noticing what he does with that realisation. He does not analyse his flaws or measure himself against others. He praises. Many of us struggle to speak about our bodies with anything other than criticism. We focus on what we wish were different and overlook the astonishing things our bodies do every moment: breathing, healing, balancing, carrying, embracing. Fitness culture can feed that criticism if we are not careful, turning training into a constant attempt to fix what is wrong. Scripture offers a different starting point. You are not a mistake to be corrected. You are a creation to be cared for. Training can then flow from gratitude rather than shame. Today, before you look in a mirror or step on a scale, praise God for one specific way your body works.","p":"Creator God, I praise You, for I am fearfully and wonderfully made.","tr":"Complete today's scheduled workout, noticing what your body can do rather than how it looks. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"What would change if you spoke about your body the way David speaks to God about it?"},{"d":24,"t":"The LORD Looketh on the Heart","r":"1 Samuel 16:7","s":"But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.","v":"When Samuel went to anoint Israel's next king, he was impressed by Eliab's appearance and height. God corrected him: man looks on the outward appearance, but the Lord looks on the heart. The youngest son, David, out tending sheep, was God's choice. We live in a world preoccupied with appearance, and fitness spaces can intensify it. Before-and-after photos, filtered images and constant comparison quietly suggest that our worth rises and falls with how we look. God does not measure you that way. Your value is not in your waistline, muscle definition or age. He sees your heart. That does not make the body unimportant, but it puts appearance in its proper place. Today, if comparison creeps in, remember that God's gaze rests on your heart, and His love for you is not a reward for looking a certain way.","p":"Lord, free me from comparison, and help me care most about what You see in my heart.","tr":"Complete today's scheduled workout, focusing on how you feel and move rather than how you look. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"How much does appearance shape the way you value yourself and others?"},{"d":25,"t":"Bodily Exercise Profiteth Little","r":"1 Timothy 4:8","s":"For bodily exercise profiteth little: but godliness is profitable unto all things, having promise of the life that now is, and of that which is to come.","v":"It may seem strange to find this verse in a fitness challenge. Paul tells Timothy that bodily exercise profits little, but godliness is profitable for all things, holding promise for this life and the life to come. Paul is not dismissing exercise; he grants that it has some value. But he refuses to let it become ultimate. That is a healthy guardrail. Training is good, but it can quietly become an idol: the thing that defines our identity, dictates our mood and crowds out relationships and worship. A wise disciple holds fitness with an open hand. It serves the greater goal of a godly life: loving God, loving neighbours and being useful in His kingdom. Today, enjoy your training, but also invest in godliness. Spend a few extra minutes in prayer, reach out to someone in need, or practise patience. That training lasts forever.","p":"Lord, keep my training in its right place, and grow in me a godliness that lasts.","tr":"Complete today's scheduled workout, then spend five minutes in prayer or Scripture. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Is there any sign that fitness has become too central in your life? What would rebalancing look like?"},{"d":26,"t":"Do All to the Glory of God","r":"1 Corinthians 10:31","s":"Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God.","v":"Paul says that whether we eat, drink or do anything else, we should do all to the glory of God. Food is one of the most ordinary parts of life, and one of the places where many of us struggle most. Some people eat to numb stress. Others feel constant guilt about every bite. Neither honours God. Eating to His glory begins with gratitude: receiving food as a good gift, giving thanks sincerely and enjoying meals with others. It includes wisdom: nourishing our bodies well enough to work, serve and recover. And it includes freedom: food is not a moral scorecard, and a single meal does not determine your worth. Today, slow down at one meal. Give thanks before you eat. Eat with attention rather than distraction. Notice how food can become an occasion for worship rather than a source of anxiety.","p":"Lord, thank You for the food You provide; help me eat with gratitude, wisdom and freedom.","tr":"Complete today's scheduled workout, and eat one meal slowly and without screens, giving thanks first. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Is your relationship with food marked more by gratitude, guilt or distraction?"},{"d":27,"t":"And He Rested","r":"Genesis 2:2","s":"And on the seventh day God ended his work which he had made; and he rested on the seventh day from all his work which he had made.","v":"On the seventh day, God rested from all His work. The Almighty did not need to recover from fatigue; He was establishing a pattern for His creation. Rest is woven into the fabric of the world from the very beginning. It is not a reward for the productive or a concession for the weak. It is part of how we were made to flourish. Every good training program includes rest days, because the body adapts during recovery, not during the workout itself. Our souls work in a similar way. Without rhythms of rest, we grow brittle, anxious and less able to love others well. Many driven people find rest harder than effort. If that is you, consider that rest is an act of trust. It says, \"The world does not depend on me.\" Today, whether it is a training day or not, build in a real pause, and receive it as a gift.","p":"Lord, teach me to rest as You designed, trusting You with what I leave undone.","tr":"If today is a training day, complete your scheduled workout and plan a genuine rest day this week. If it's a rest day: rest fully, with a gentle 15-minute walk if you'd like.","q":"Do you treat rest as a gift, a reward or a weakness? Why?"},{"d":28,"t":"Come Ye Apart and Rest a While","r":"Mark 6:31","s":"And he said unto them, Come ye yourselves apart into a desert place, and rest a while: for there were many coming and going, and they had no leisure so much as to eat.","v":"The disciples had just returned from a busy mission, full of stories. So many people were coming and going that they had no time even to eat. Jesus did not tell them to push harder. He said, \"Come ye yourselves apart into a desert place, and rest a while.\" Jesus cares about the exhaustion of His followers. He invites them to step away, not as a reward, but as a necessity. Notice too that He says \"come\", which means with Him. Rest is not merely the absence of activity; it is time in His presence. In a culture that celebrates busyness, slowing down can feel like falling behind. But overtraining, chronic stress and poor sleep wear down both body and soul. Today, find a quiet place, even for ten minutes, to sit with Jesus. Bring Him your fatigue and let Him restore you.","p":"Jesus, I come to You in my weariness; give me rest in Your presence.","tr":"Complete today's scheduled workout at a comfortable effort. Rest day: 10 minutes of quiet prayer, then a slow 20-minute walk.","q":"When did you last truly step away to rest with Jesus? What keeps you from it?"},{"d":29,"t":"He Giveth His Beloved Sleep","r":"Psalm 127:2","s":"It is vain for you to rise up early, to sit up late, to eat the bread of sorrows: for so he giveth his beloved sleep.","v":"The psalmist observes that it is vain to rise up early and sit up late, eating the bread of anxious toil, for God gives His beloved sleep. Sleep is one of the clearest pictures of our dependence. Every night we must stop, lie down and trust that the world will keep turning without us. For many, sleep is the first thing sacrificed to a busy schedule, yet it is among the most powerful tools for recovery, mood and health. Anxious overwork, the psalm suggests, is ultimately fruitless, because unless the Lord builds the house, the builders labour in vain. Choosing sleep can be an act of faith, confessing that we are creatures, not machines. Tonight, protect your sleep. Set a reasonable bedtime, put devices away, and before you close your eyes, commit tomorrow's concerns to the One who never sleeps.","p":"Lord, I trust You with what is undone; grant me restful sleep tonight.","tr":"Complete today's scheduled workout, earlier in the day if you can, and aim to be in bed 30 minutes earlier tonight. Rest day: a 20-minute walk and gentle stretching before bed.","q":"What keeps you from getting the sleep your body needs, and what is one change you could make?"},{"d":30,"t":"They That Wait Upon the LORD","r":"Isaiah 40:31","s":"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","v":"Isaiah wrote to weary people who felt forgotten by God. His answer was not a pep talk about trying harder. It was an invitation to wait upon the Lord. Waiting, in the biblical sense, is not passive. It is hopeful dependence, looking to God for what we cannot generate ourselves. And the result is renewed strength: mounting up with wings as eagles, running without weariness, walking without fainting. Notice the order: soaring, then running, then walking. Sometimes the greatest strength is simply to keep walking. Ten days remain in this challenge. You may feel energised, or you may be running on empty. Either way, strength for the final stretch does not come from willpower alone. It comes from returning, again and again, to the One who renews. Take a few minutes today to wait on Him in silence before you do anything else.","p":"Lord, I wait on You; renew my strength for the road ahead.","tr":"Complete today's scheduled workout. Rest day: two minutes of silent prayer, then a 20-minute walk and 10 minutes of mobility.","q":"Are you trying to renew your strength on your own? What would waiting on the Lord look like today?"},{"d":31,"t":"He Restoreth My Soul","r":"Psalm 23:1–3","s":"The LORD is my shepherd; I shall not want. He maketh me to lie down in green pastures: he leadeth me beside the still waters. He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.","v":"Psalm 23 is beloved because it describes a God who cares for the whole person. The shepherd provides, so \"I shall not want.\" He leads to green pastures and still waters, places of nourishment and rest. He restores the soul. And He leads in paths of righteousness for His name's sake. Notice that the sheep do not make themselves lie down; the shepherd makes them lie down. Sometimes God's care comes as a gentle limit: an illness that slows us, a season that forces rest. Restoration is not only physical. Our souls are depleted by stress, conflict, grief and constant noise. Exercise can help, but it cannot restore a soul on its own. Only the Shepherd can. Today, follow His lead to a still place. Read the whole psalm slowly, and let Him restore what is depleted in you.","p":"Good Shepherd, lead me beside still waters today and restore my soul.","tr":"Complete today's scheduled workout. Rest day: a slow 20-minute walk outdoors, praying Psalm 23 as you go.","q":"Where do you need the Shepherd's restoration most right now?"},{"d":32,"t":"Two Are Better Than One","r":"Ecclesiastes 4:9–10","s":"Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up.","v":"The Preacher observes that two are better than one, because if one falls, the other can lift him up. Woe to the one who is alone when he falls. We were never meant to walk the narrow way alone. Faith is lived in community, and so, often, is perseverance. A training partner makes it harder to skip an early session. A friend who knows your struggles can encourage you when you are discouraged. A church family can carry you through seasons when you cannot carry yourself. Many of us find it easier to help others than to ask for help, but receiving support is also a form of humility. Today, consider who walks alongside you. Is there someone you could invite to train with you, pray with you or simply check in on you? And is there someone who is falling and needs your hand?","p":"Lord, thank You for the people You've placed around me; help me lift others and let others lift me.","tr":"Complete today's scheduled workout, and invite someone to join you for a session or walk this week. Rest day: a 20-minute walk with a friend or family member if you can.","q":"Who could you invite to walk with you in your faith or your health?"},{"d":33,"t":"Iron Sharpeneth Iron","r":"Proverbs 27:17","s":"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.","v":"\"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.\" Sharpening involves friction. Two blades scrape against each other, and both become more useful. Good friendships are not always comfortable. A true friend will tell you when your form is off, when you are overtraining, or when your priorities are drifting. They challenge you to grow, and they let you return the favour. This kind of relationship requires humility and honesty. It is easy to surround ourselves with people who only affirm us, or to avoid close relationships entirely to protect ourselves. But growth happens in honest community. Training partners, small groups and mentors can all be iron in our lives. Today, think about who sharpens you, and whether you sharpen anyone. Thank someone who has spoken honestly to you, and be ready to receive correction with grace.","p":"Lord, give me friends who sharpen me, and make me a friend who sharpens others in love.","tr":"Complete today's scheduled workout, and ask someone you trust for honest feedback on your form or routine. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Who sharpens you, and how can you be that kind of friend to someone else?"},{"d":34,"t":"Bear Ye One Another's Burdens","r":"Galatians 6:2","s":"Bear ye one another's burdens, and so fulfil the law of Christ.","v":"Paul instructs us to bear one another's burdens and so fulfil the law of Christ. The law of Christ is love, and love is often expressed by sharing a load someone cannot carry alone. Strength is a gift meant to be shared. The physical strength you are building can help a neighbour move furniture, carry groceries for an elderly friend, or keep up with children at play. The perseverance you are developing can help you sit patiently with someone who is grieving. The discipline you are practising can make you dependable when others need you. Fitness that only serves ourselves misses its highest purpose. Today, look for a burden to share. It might be practical, like helping with a chore, or relational, like a phone call to someone who is struggling. Let your strength become a blessing to someone else.","p":"Lord, show me whose burden I can help carry today, and give me a willing heart.","tr":"Complete today's scheduled workout, then use some of your strength to help someone in a practical way. Rest day: a 20-minute walk and one act of service.","q":"Whose burden could you help carry this week?"},{"d":35,"t":"Walk Humbly With Thy God","r":"Micah 6:8","s":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","v":"The people in Micah's day wondered what offering would please God: burnt offerings, thousands of rams, rivers of oil? Micah's answer cuts through religious performance: do justly, love mercy, walk humbly with your God. Walking humbly is a fitting image for this stage of the challenge. Humility is not thinking poorly of ourselves; it is seeing ourselves truthfully, as beloved creatures who depend on God. In training, humility means using honest weights, respecting our limits and celebrating others' progress without envy. It means admitting when we need rest or help. In life, it means caring about justice and mercy more than about our image. A walk is not a sprint. It is steady, companionable and daily. Five days remain. Walk them humbly, not trying to impress God, but simply staying close to Him.","p":"Lord, teach me to do justly, love mercy and walk humbly with You.","tr":"Complete today's scheduled workout with honest weights and no ego lifting. Rest day: a 30-minute walk, praying as you go.","q":"In what area of life is pride or performance getting in the way of walking humbly with God?"},{"d":36,"t":"Good Stewards of Grace","r":"1 Peter 4:10","s":"As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God.","v":"Peter writes that every person has received a gift, and we are to use it to serve one another as good stewards of God's manifold grace. Stewards do not own what they manage; they care for it on behalf of someone else. Your health, energy, time and abilities are all gifts. Over these weeks you have been stewarding your body. Now consider the other gifts entrusted to you. Perhaps you are an encourager, a teacher, an organiser, a good listener or someone who makes people laugh. These gifts are not for private enjoyment. They are given so that grace can flow through you to others. As the challenge nears its end, ask how your growing strength and discipline might serve. Could you encourage a beginner, volunteer, or walk alongside someone just starting their journey? Grace received becomes grace shared.","p":"Lord, thank You for the gifts You have given me; help me use them faithfully to serve others.","tr":"Complete today's scheduled workout, then send a word of encouragement to someone who is just starting out. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"What gift has God entrusted to you that could serve someone else this week?"},{"d":37,"t":"Content in Every State","r":"Philippians 4:12–13","s":"I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need. I can do all things through Christ which strengtheneth me.","v":"\"I can do all things through Christ which strengtheneth me\" is one of the most quoted verses in sport. Yet in context, Paul is not talking about winning. He is talking about contentment. He has learned to be full and to be hungry, to abound and to suffer need. The strength Christ gives is strength to be faithful and content in every circumstance, including hard ones. This matters for anyone pursuing fitness goals. You may reach your target, or you may not. You may set a personal record, or an injury may sideline you. Paul's secret is not that Christ guarantees outcomes, but that Christ is sufficient in all of them. Contentment does not kill ambition; it frees it from anxiety. Today, whatever your results so far, give thanks for where you are and ask for strength to be faithful in it.","p":"Lord Jesus, teach me to be content in every circumstance, and strengthen me to be faithful in each one.","tr":"Complete today's scheduled workout, whatever your energy level, and be content with your honest best. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"Is your peace currently tied to reaching a particular outcome? What would contentment look like?"},{"d":38,"t":"In Every Thing Give Thanks","r":"1 Thessalonians 5:18","s":"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","v":"Paul writes, \"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.\" Notice that he says in every thing, not for every thing. We do not have to be grateful for pain, injustice or loss. But in the middle of any circumstance, we can find reasons to thank God, because He is present and good. Gratitude reshapes our perspective. It turns our attention from what is lacking to what has been given. Look back over these thirty-eight days. What can you give thanks for? Perhaps a workout you did not want to do but finished. A morning you felt strong. A friend who encouraged you. A verse that met you at the right moment. Even the days you missed can remind you of grace. Today, write down five things you are thankful for from this challenge, and thank God for each one.","p":"Father, thank You for Your presence in every part of this journey; make me a grateful person.","tr":"Complete today's scheduled workout, giving thanks between sets. Rest day: a 20-minute gratitude walk, naming one thing you're thankful for each minute.","q":"What are five things from this challenge that you are thankful for?"},{"d":39,"t":"Nothing Shall Separate Us","r":"Romans 8:38–39","s":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.","v":"As the challenge draws to a close, Paul's great declaration is worth hearing again: nothing in all creation can separate us from the love of God which is in Christ Jesus our Lord. Not death or life, not angels or powers, not things present or things to come. That list does not mention a missed workout, a stalled scale or a broken streak, but if angels and powers cannot separate us from God's love, those certainly cannot. Some people will finish these forty days with every box ticked. Others will have gaps and catch-up days. Some may feel they have failed. Hear this clearly: your standing with God has never depended on your performance in this challenge. His love was not earned on day one and cannot be lost on day thirty-nine. The disciplines matter, but they are responses to love, not the price of it.","p":"Lord, thank You that nothing can separate me from Your love in Christ Jesus.","tr":"Complete today's scheduled workout, and if you have missed days, catch up on one devotional. Rest day: a 20-minute walk and 10 minutes of mobility.","q":"How does knowing that God's love doesn't depend on your performance change the way you see this challenge?"},{"d":40,"t":"I Have Finished My Course","r":"2 Timothy 4:7","s":"I have fought a good fight, I have finished my course, I have kept the faith:","v":"Near the end of his life, Paul wrote, \"I have fought a good fight, I have finished my course, I have kept the faith.\" These are not the words of someone who never struggled. Paul was shipwrecked, beaten, imprisoned and abandoned. His course was not smooth, but he finished it faithfully. Today you finish a course too, small compared with Paul's but real. You have spent forty days with Scripture and with your body, practising discipline, perseverance, rest and gratitude. Whatever your path looked like, finishing matters. Yet this is not the end of the narrow way. The goal was never forty days of perfection, but a life of faithful steps. Celebrate today. Thank God for His grace along the way. Then consider which habits you want to carry forward, and keep walking through the narrow gate, one day at a time.","p":"Lord, thank You for carrying me through these forty days; help me keep the faith and keep walking with You.","tr":"Complete today's scheduled workout as a celebration of the journey. Rest day: a 30-minute celebration walk, thanking God for what you've learned.","q":"Which habit from these forty days do you most want to carry forward?"}],"bg":[{"id":"first-workout","n":"First Step","ds":"Complete your first workout.","c":"training","tier":"bronze"},{"id":"workouts-10","n":"Showing Up","ds":"Complete 10 workouts.","c":"training","tier":"bronze"},{"id":"workouts-25","n":"Committed","ds":"Complete 25 workouts.","c":"training","tier":"silver"},{"id":"workouts-50","n":"Iron Habit","ds":"Complete 50 workouts.","c":"training","tier":"silver"},{"id":"workouts-100","n":"Centurion","ds":"Complete 100 workouts.","c":"training","tier":"gold"},{"id":"early-bird","n":"Early Bird","ds":"Start a workout between 4am and 7am.","c":"training","tier":"bronze"},{"id":"first-pr","n":"New Best","ds":"Beat one of your own records.","c":"strength","tier":"bronze"},{"id":"prs-10","n":"Record Breaker","ds":"Set 10 personal records.","c":"strength","tier":"silver"},{"id":"prs-25","n":"Relentless","ds":"Set 25 personal records.","c":"strength","t ,rest:180,rpe:7},{ex:"barbell-row",sets:3,reps:"8",rest:120,rpe:7},{ex:"plank",sets:2,seconds:45,rest:60}]},{name:"Day B",focus:"Squat, press, deadlift",minutes:60,exercises:[{ex:"back-squat",sets:3,reps:"5",rest:180,rpe:7},{ex:"overhead-press",sets:3,reps:"5",rest:180,rpe:7},{ex:"conventional-deadlift",sets:1,reps:"5",rest:180,rpe:7,notes:"One top set after warm-ups."},{ex:"chin-up",sets:3,reps:"5-8",rest:120,notes:"Use band assistance if needed."}]},{name:"Day C",focus:"Squat, bench, accessories",minutes:60,exercises:[{ex:"back-squat",sets:3,reps:"5",rest:180,rpe:7},{ex:"bench-press",sets:3,reps:"5",rest:180,rpe:7},{ex:"romanian-deadlift",sets:3,reps:"8",rest:120,rpe:7},{ex:"face-pull",sets:3,reps:"15",rest:60},{ex:"hanging-knee-raise",sets:3,reps:"8-12",rest:60}]}]},{slug:"powerlifting-base-block",name:"Powerlifting Base Block",summary:"Four days of RPE-driven squat, bench and deadlift training.",description:"An intermediate block to build strength and technique in the competition lifts. Intensity is autoregulated with RPE so the plan adapts to your day. Includes variation lifts and targeted accessories.",category:"powerlifting",types:["powerlifting","strength"],difficulty:"intermediate",weeks:8,sessionMinutes:75,goals:["build_strength"],equipment:["barbell","rack","bench","dumbbell","cable"],tier:"plus",progression:"Target RPE rises by about 0.5 each week (weeks 1\u20133, then 5\u20137). Week 4 drops volume slightly. If a top set feels harder than the target RPE, keep the weight and repeat it next week. Week 8 is a deload before re-testing.",progressionModel:"linear_rpe",deloadFinalWeek:!0,warmup:S,cooldown:f,days:[{name:"Squat Focus",focus:"Competition squat + posterior chain",minutes:75,exercises:[{ex:"back-squat",sets:4,reps:"4",rest:210,rpe:7,intensity:"~75\u201380% 1RM"},{ex:"romanian-deadlift",sets:3,reps:"8",rest:150,rpe:7},{ex:"bulgarian-split-squat",sets:3,reps:"8 per side",rest:90},{ex:"ab-wheel-rollout",sets:3,reps:"8-10",rest:60}]},{name:"Bench Focus const icon = (n, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ""}</svg>`;

/* ---------- Helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const startOfWeek = t => { const d = new Date(startOfDay(t)); const wd = (d.getDay() + 6) % 7; return d.getTime() - wd * DAY; };
const fmtDate = (t, o = { month: "short", day: "numeric" }) => new Date(t).toLocaleDateString(undefined, o);
const fmtDur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
const round = (v, d = 1) => Math.round(v * 10 ** d) / 10 ** d;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const e1rm = (w, r) => (r <= 0 || w <= 0) ? 0 : r === 1 ? w : w * (1 + r / 30);
const firstInt = s => { const m = String(s ?? "").match(/\d+/); return m ? parseInt(m[0], 10) : 0; };
const titleCase = s => String(s).replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const unit = () => S.units;
const videoUrl = name => `https://www.youtube.com/results?search_query=${encodeURIComponent(name + " proper form")}`;
const toDisp = kg => S.units === "lb" ? round(kg * KG_LB, 1) : round(kg, 1);
const fromDisp = v => S.units === "lb" ? v / KG_LB : v;
const fmtW = kg => `${toDisp(kg)} ${S.units}`;
const fmtVol = kg => { const v = S.units === "lb" ? kg * KG_LB : kg; return v >= 10000 ? `${round(v / 1000, 1)}k ${S.units}` : `${Math.round(v).toLocaleString()} ${S.units}`; };
let rngSeed = 7;
const rnd = () => { rngSeed = (rngSeed * 16807) % 2147483647; return (rngSeed - 1) / 2147483646; };

/* ---------- State & storage ---------- */
let S;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) { /* storage unavailable: demo still works for this visit */ } }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const v = JSON.parse(raw); if (v && v.v === 1) return v; } } catch (_) { }
  return null;
}
function blank() {
  return { v: 1, myFoods: [], name: "Athlete", units: "lb", faith: true, goal: "build_strength", active: null, workouts: [], bw: [], food: {}, journal: [], disc: {}, draft: null, chat: [], seeded: false };
}

function lastSetFor(slug, before = Infinity) {
  for (let i = S.workouts.length - 1; i >= 0; i--) {
    const w = S.workouts[i]; if (w.end >= before) continue;
    const ex = w.ex.find(x => x.s === slug && !x.skipped);
    if (ex) { const done = ex.sets.filter(s => s.done); if (done.length) return done[done.length - 1]; }
  }
  return null;
}

function seed() {
  S = blank(); S.seeded = true; rngSeed = 11;
  const prog = PR["barbell-strength-foundations"];
  const base = { "back-squat": 135, "bench-press": 115, "conventional-deadlift": 185, "overhead-press": 75 };
  const now = Date.now();
  const firstMon = startOfWeek(now) - 4 * 7 * DAY;
  const offs = [0, 2, 4];
  let wi = 0;
  for (let wk = 0; wk < 4; wk++) {
    const week = prog.wk[wk];
    week.days.forEach((day, di) => {
      if (wk === 2 && di === 1) return; // one missed day keeps it realistic
      const start = firstMon + (wk * 7 + offs[di]) * DAY + (17 * 3600 + Math.floor(rnd() * 3600)) * 1000;
      const ex = day.x.map(t => {
        const [slug, sets, reps, secs] = t; const e = EX[slug];
        const target = firstInt(reps) || 8;
        let lb = base[slug];
        if (lb === undefined) lb = e && e.e.includes("barbell") ? 65 : e && e.e.includes("dumbbell") ? 30 : e && (e.e.includes("cable") || e.e.includes("machine")) ? 60 : 0;
        lb = Math.round(lb * (1 + 0.045 * wk) / 5) * 5;
        return { s: slug, rest: t[4] || 90, sets: Array.from({ length: sets }, (_, i) => ({
          w: lb ? lb / KG_LB : 0,
          r: secs ? 0 : Math.max(1, target + (i === 0 ? 1 : 0) - (rnd() < 0.25 ? 1 : 0)),
          sec: secs || 0, done: true })) };
      });
      const dur = 45 * 60 + Math.floor(rnd() * 900);
      const w = { id: uid(), name: `${day.n}`, prog: { s: prog.s, w: wk, d: di }, start, end: start + dur * 1000, ex, notes: "" };
      finalizeWorkout(w); S.workouts.push(w); wi++;
    });
  }
  S.active = { s: prog.s, w: 4, d: 0, started: firstMon };
  let bw = 192;
  for (let d = 42; d >= 1; d -= 2) { bw -= 0.22 + (rnd() - 0.5) * 0.9; S.bw.push({ t: startOfDay(now - d * DAY) + 7 * 3600000, kg: round(bw, 1) / KG_LB }); }
  const yk = dayKey(now - DAY), tk = dayKey(now);
  S.food[yk] = { water: 7, items: [
    { id: uid(), meal: "breakfast", n: "Oatmeal with berries", kcal: 380, p: 12, c: 64, f: 8 },
    { id: uid(), meal: "lunch", n: "Chicken rice bowl", kcal: 640, p: 48, c: 70, f: 16 },
    { id: uid(), meal: "snack", n: "Greek yogurt, plain, nonfat", kcal: 100, p: 17, c: 6, f: 1 },
    { id: uid(), meal: "dinner", n: "Salmon, potatoes & greens", kcal: 720, p: 45, c: 55, f: 32 }] };
  S.food[tk] = { water: 3, items: [{ id: uid(), meal: "breakfast", n: "Eggs & toast", kcal: 420, p: 26, c: 32, f: 20 }] };
  S.disc[yk] = { pray: true, read: true, train: false, rest: true };
  S.journal.push({ id: uid(), t: now - 2 * DAY, text: "Hard squat day, but I finished every set. Grateful for the strength to keep showing up." });
  save();
}

function finalizeWorkout(w) {
  let vol = 0, sets = 0;
  const prs = [];
  w.ex.forEach(x => {
    if (x.skipped) return;
    const done = x.sets.filter(s => s.done);
    sets += done.length;
    done.forEach(s => { vol += (s.w || 0) * (s.r || 0); });
    const best = Math.max(0, ...done.map(s => e1rm(s.w || 0, s.r || 0)));
    const heavy = Math.max(0, ...done.filter(s => s.r > 0).map(s => s.w || 0));
    if (best <= 0) return;
    let prevBest = 0, prevHeavy = 0, seen = false;
    S.workouts.forEach(o => { if (o.end >= w.end) return; o.ex.forEach(y => { if (y.s !== x.s || y.skipped) return; y.sets.filter(s => s.done).forEach(s => { seen = true; prevBest = Math.max(prevBest, e1rm(s.w || 0, s.r || 0)); if (s.r > 0) prevHeavy = Math.max(prevHeavy, s.w || 0); }); }); });
    if (!seen) return; // first time isn't a "record", it's a baseline
    if (best > prevBest + 0.01) prs.push({ s: x.s, type: "Est. 1RM", kg: best });
    else if (heavy > prevHeavy + 0.01) prs.push({ s: x.s, type: "Heaviest", kg: heavy });
  });
  w.vol = vol; w.sets = sets; w.prs = prs;
}

const CHARTS = {};
let chartN = 0;
function chartSlot(spec) { const id = "c" + (++chartN); CHARTS[id] = spec; return `<div class="chart" data-chart="${id}" style="height:${spec.h || 180}px"></div>`; }
function drawCharts() {
  document.querySelectorAll("[data-chart]").forEach(el => {
    const spec = CHARTS[el.dataset.chart]; if (!spec) return;
    const W = Math.max(240, el.clientWidth); el.innerHTML = spec.type === "bars" ? barsSvg(spec, W) : lineSvg(spec, W);
  });
}
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || mag * 10;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(round(v, 4)); return out;
}
function lineSvg(spec, W) {
  const H = spec.h || 180, L = 40, Rr = 12, T = 10, B = 24;
  const pts = spec.series.flatMap(s => s.pts);
  if (!pts.length) return `<div class="empty small">No data in this range yet.</div>`;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = spec.x0 ?? Math.min(...xs), x1 = spec.x1 ?? Math.max(...xs);
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = x => L + (x1 === x0 ? (W - L - Rr) / 2 : (x - x0) / (x1 - x0) * (W - L - Rr));
  const Y = y => T + (1 - (y - y0) / (y1 - y0 || 1)) * (H - T - B);
  let g = ticks.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#262626"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="#8a8a8a">${spec.yfmt ? spec.yfmt(t) : t}</text>`).join("");
  const nx = Math.min(5, Math.max(2, Math.floor(W / 110)));
  for (let i = 0; i < nx; i++) { const t = x0 + (x1 - x0) * i / (nx - 1); g += `<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nx - 1 ? "end" : "middle"}" font-size="11" fill="#8a8a8a">${fmtDate(t)}</text>`; }
  spec.series.forEach(s => {
    if (!s.pts.length) return;
    const d = s.pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += s.pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.pts.length > 30 ? 0 : 3.5}" fill="${s.color}"><title>${esc(s.name)} · ${fmtDate(p[0])}: ${spec.yfmt ? spec.yfmt(p[1]) : p[1]}</title></circle>`).join("");
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(spec.label || "chart")}">${g}</svg>`;
}
function barsSvg(spec, W) {
  const H = spec.h || 160, L = 32, Rr = 6, T = 14, B = 24;
  const max = Math.max(spec.min || 1, ...spec.data.map(d => d.v));
  const ticks = niceTicks(0, max, 3); const y1 = ticks[ticks.length - 1];
  const n = spec.data.length, bw = (W - L - Rr) / n;
  const Y = v => T + (1 - v / y1) * (H - T - B);
  let g = ticks.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#262626"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="#8a8a8a">${t}</text>`).join("");
  const every = Math.ceil(n / Math.floor(W / 44));
  spec.data.forEach((d, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64, y = Y(d.v);
    if (d.v > 0) g += `<rect x="${x}" y="${y}" width="${w}" height="${Y(0) - y}" rx="${Math.min(4, w / 2)}" fill="${d.hi ? "#e6c76e" : "#B08D3A"}"><title>${esc(d.l)}: ${d.v}</title></rect>`;
    if (i % every === 0) g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="${d.hi ? "#e6c76e" : "#8a8a8a"}">${esc(d.l)}</text>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(spec.label || "chart")}">${g}</svg>`;
}
function ringSvg(v, target, color, size = 88) {
  const r = size / 2 - 7, c = 2 * Math.PI * r, f = target > 0 ? Math.min(1, v / target) : 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="#262626" stroke-width="8" fill="none"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${color}" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="50%" dy="5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Oswald, sans-serif">${Math.round(v)}</text></svg>`;
}

/* ---------- Derived data ---------- */
function currentBwKg() { return S.bw.length ? S.bw[S.bw.length - 1].kg : 80; }
function targets() {
  const me = S.me || {};
  const t = NGB.estimateNutritionTargets({ weightKg: currentBwKg(), trainingDaysPerWeek: me.days || 4, goal: S.goal || "build_strength", sex: me.sex || null, age: me.age || null, heightCm: me.heightCm || null, diet: S.diet || "balanced" });
  return { kcal: t.calories, p: t.protein_g, c: t.carbs_g, f: t.fat_g, water: Math.max(6, Math.round(t.water_ml / 250)) };
}
function foodDay(k) { return S.food[k] || { water: 0, items: [] }; }
function sumFood(k) { const d = foodDay(k); return d.items.reduce((a, i) => ({ kcal: a.kcal + (+i.kcal || 0), p: a.p + (+i.p || 0), c: a.c + (+i.c || 0), f: a.f + (+i.f || 0) }), { kcal: 0, p: 0, c: 0, f: 0 }); }
function weekStreak() {
  let n = 0, wk = startOfWeek(Date.now());
  const has = w0 => S.workouts.some(w => w.start >= w0 && w.start < w0 + 7 * DAY);
  if (!has(wk)) wk -= 7 * DAY;
  while (has(wk)) { n++; wk -= 7 * DAY; }
  return n;
}
function nextSession() {
  if (!S.active) return null;
  const p = PR[S.active.s]; if (!p) return null;
  const week = p.wk[S.active.w]; if (!week) return { p, done: true };
  const day = week.days[S.active.d]; if (!day) return { p, done: true };
  return { p, week, day, w: S.active.w, d: S.active.d };
}
function allPRs() { const out = []; S.workouts.forEach(w => (w.prs || []).forEach(r => out.push({ ...r, t: w.end, wid: w.id }))); return out.reverse(); }
function exName(s) { return EX[s] ? EX[s].n : titleCase(s); }

}

/* ---------- Barcode (Open Food Facts) ---------- */
function validBarcode(code) {
  if (!/^\d{8}$|^\d{12,13}$/.test(code)) return false;
  const digits = code.split("").map(Number), check = digits.pop(); let sum = 0;
  digits.reverse().forEach((n, i) => { sum += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - (sum % 10)) % 10 === check;
}

  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments,serving_size`);
    const j = await r.json();
    if (!j || j.status !== 1 || !j.product) { if (box) box.innerHTML = `<p class="small">No product found for ${esc(code)}. Use the Manual tab to add it.</p>`; return; }
    const p = j.product, n = p.nutriments || {};
