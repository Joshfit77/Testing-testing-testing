# gitleaks configuration (CI job "security-scan" in .github/workflows/ci.yml).
# The default rules apply. The allowlist below covers only values that are published or test-only, each limited to
# test files: the Supabase CLI's well-known local-stack demo JWTs (issuer "supabase-demo"; they only work against a
# local stack) and fixed passwords/secrets used by the automated tests against that local stack.
title = "Narrow Gate Fitness"

[extend]
useDefault = true

[[allowlists]]
description = "Supabase CLI local-stack demo JWTs (published defaults, issuer supabase-demo) in test helpers"
condition = "AND"
paths = ['''^(tests|e2e)/''']
regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIi''']

[[allowlists]]
description = "Fixed test-only passwords and secrets for the local test stack"
condition = "AND"
paths = ['''^(tests|e2e)/''']
regexes = ['''^Integration-Test-1$''', '''^Gate-Strong-2026$''', '''^cron-integration-secret-0123456789$''']

# Reviewed 2026-11-20 (PR #12 security-scan): each entry is one exact value, limited to the files it appears in.
[[allowlists]]
description = "Test fixture: a made-up prayer-journal string the AI-privacy test checks never reaches a prompt"
condition = "AND"
paths = ['''^tests/unit/ai-context-privacy\.test\.ts$''']
regexes = ['''^PRIVATE-PRAYER-9f3a$''']

[[allowlists]]
description = "Test fixture: the integration tests' memory-encryption key (base64 of 'test-only-memory-key-32-bytes!!!'), never used outside tests"
condition = "AND"
paths = ['''^tests/integration/setup\.ts$''']
regexes = ['''^dGVzdC1vbmx5LW1lbW9yeS1rZXktMzItYnl0ZXMhISE=$''']

[[allowlists]]
description = "Public catalog ids in the generated seed: program categories 'hypertrophy' and 'recovery-deload' (deterministic UUIDs, scripts/generate-seed.ts)"
condition = "AND"
paths = ['''^supabase/(seed|setup-all)\.sql$''']
regexes = ['''^8f19916a-c1e0-5027-887e-6f78ca07b045$''', '''^93e126f2-1ee0-5555-97ae-5e7a8a4e10d2$''']
