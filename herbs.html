<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herb Library — Beauty &amp; Praise</title>
  <meta name="description" content="Browse 100 herb profiles with traditional uses, preparation, growing tips and safety notes.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beauty &amp; Praise">
  <meta property="og:title" content="Herb Library — Beauty &amp; Praise">
  <meta property="og:description" content="Browse 100 herb profiles with traditional uses, preparation, growing tips and safety notes.">
  <meta property="og:image" content="images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="images/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="herbs">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span id="crumb-current" aria-current="page">Herb Library</span></nav>
        <h1 id="page-title">The Herb Library</h1>
        <p class="lead">Over a hundred herbs, spices and botanicals — their stories, traditional uses, how to prepare them, and what to be careful about.</p>
      </div>
    </section>

    <section class="section section-top-tight">
      <div class="container">
        <div class="toolbar">
          <label class="field search-field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm10 17-5-5"/></svg>
            <input type="search" id="herb-search" placeholder="Search by name, use or benefit…" aria-label="Search herbs">
          </label>
          <select id="cat-filter" class="field" aria-label="Filter by category"></select>
          <select id="part-filter" class="field" aria-label="Filter by part used"></select>
          <select id="sort" class="field" aria-label="Sort">
            <option value="az">Name: A to Z</option>
            <option value="za">Name: Z to A</option>
          </select>
          <label class="check-field"><input type="checkbox" id="saved-only"> Saved only</label>
        </div>
        <div class="az" id="az" role="group" aria-label="Filter by first letter"></div>
        <div class="results-bar"><p id="result-count"></p><button class="text-btn" id="clear-filters">Clear all filters</button></div>
        <div class="herb-grid" id="herb-grid"></div>
        <div class="empty-state" id="no-results" hidden><p id="no-results-text"></p></div>
        <div class="center"><button class="btn btn-outline" id="load-more">Load more herbs</button></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/herbs-data.js"></script>
  <script src="js/herbs-summary.js"></script>
  <script src="js/herbs-benefits.js"></script>
  <script src="js/herbs-pharm.js"></script>
  <script src="js/herbs-caps.js"></script>
  <script src="js/fruits-data.js"></script>
  <script src="js/stacks.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/drugs.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/bible.js"></script>
  <script src="js/quiz-questions.js"></script>
  <script src="js/content.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/devotional.js"></script>
  <script src="js/art.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/my-photos.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
