      <stop offset="0" stop-color="#0b0906"/>
      <stop offset="0.4" stop-color="#2a2013"/>
      <stop offset="0.72" stop-color="#7a5c2c"/>
      <stop offset="0.9" stop-color="#c9a54c"/>
      <stop offset="1" stop-color="#e3c98a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#fff0c4" stop-opacity="0.85"/>
      <stop offset="0.18" stop-color="#f1dfa8" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#8c6a2f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8c6a2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
