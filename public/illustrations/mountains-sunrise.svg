      <stop offset="1" stop-color="#e9cf8e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.68" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#fff3cf" stop-opacity="0.95"/>
      <stop offset="0.12" stop-color="#f1dfa8" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#c9a54c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c9a54c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a33"/>
      <stop offset="1" stop-color="#5b4523"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4424"/>
