<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <title>Offline · Narrow Gate Fitness</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #090909; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 28px; letter-spacing: .04em; text-transform: uppercase; margin: 20px 0 8px; }
      p { color: #b7b7b7; line-height: 1.5; }
      a, button { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 12px; border: 0; background: linear-gradient(135deg,#E6C76E,#C9A54C 50%,#8C7139); color: #0b0b0b; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Narrow Gate Fitness needs a connection to load this page. If you were logging a workout, it's saved on this device — reopen the workout when you're back online and it will sync.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
