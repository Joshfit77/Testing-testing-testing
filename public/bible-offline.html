<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <title>Bible (offline) · Narrow Gate Fitness</title>
    <!--
      The offline Bible reader. It shows only the public-domain Berean Standard Bible text saved on this device
      (/bible/bsb/*.json): no account data, no highlights, notes or journeys. Served by the service worker in place of a
      Bible page when there is no connection, and bundled into the native app (capacitor.config.ts) for its offline page.
    -->
    <style>
      :root { color-scheme: dark; --gold: #c9a54c; --gold-hi: #e6c76e; --muted: #a7a29a; --line: #2a2723; --card: #121110; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: #090909; color: #f4f1ea; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 32px) max(16px, env(safe-area-inset-left)); }
      main { max-width: 40rem; margin: 0 auto; }
      a { color: var(--gold-hi); }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
      .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 0; }
      h1 { font-size: 28px; margin: 4px 0 8px; }
      h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 24px 0 8px; }
      .notice { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 12px 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
      .grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .grid.ch { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .grid a { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: #f4f1ea; text-decoration: none; font-weight: 600; }
      .grid.ch a { justify-content: center; }
      .grid small { color: var(--muted); font-weight: 400; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: #f4f1ea; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
      .text { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; line-height: 1.8; font-size: calc(1.125rem * var(--scale, 1)); }
      .text p { margin: 0 0 4px; }
      .text sup { color: var(--gold); font-family: system-ui, sans-serif; font-size: .65em; font-weight: 600; margin-right: 4px; }
      /* Words of Jesus and the reading page: the same colours as the app (src/lib/bible/reading-display.ts, checked by a test). */
      .text { --wj: #f0736a; }
      .text .wj { color: var(--wj); }
      body.light .text { --wj: #9b1c24; background: #f8f4ea; color: #1c1915; border-radius: 16px; padding: 12px 16px; }
      body.light .text sup { color: #6f4f12; }
      body.light .text .gap { color: #57524a; border-color: #d9cfbb; }
      body.no-wj .text .wj { color: inherit; }
      .gap { font-family: system-ui, sans-serif; font-size: 14px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; margin: 4px 0; }
      nav.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
      nav.pn a { display: block; min-height: 56px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: #f4f1ea; text-decoration: none; }
      nav.pn a span { display: block; font-size: 12px; color: var(--muted); }
      nav.pn a.next { text-align: right; }
      .foot { margin-top: 24px; font-size: 12px; color: var(--muted); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="app">
      <p class="notice">Loading the Bible saved on this device…</p>
    </main>
    <noscript><p class="notice">The offline Bible needs JavaScript.</p></noscript>
    <script src="/bible-offline.js"></script>
  </body>
</html>
