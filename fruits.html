<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="100 fruit guides: what each fruit does for your body, key nutrients, benefits, how to use it, serving sizes and cautions.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beauty &amp; Praise">
  <meta property="og:title" content="Fruit Library — Beauty &amp; Praise">
  <meta property="og:description" content="100 fruit guides: what each fruit does for your body, key nutrients, benefits, how to use it, serving sizes and cautions.">
  <meta property="og:image" content="images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="images/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="fruits">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span aria-current="page">Fruit Library</span></nav>
        <h1>The Fruit Library</h1>
        <p class="lead">One hundred fruits from around the world — what they do for your body, the nutrients they bring, how to enjoy them, and what to watch out for.</p>
      </div>
    </section>

    <section class="section section-top-tight">
      <div class="container">
        <div class="toolbar">
          <label class="field search-field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm10 17-5-5"/></svg>
            <input type="search" id="fruit-search" placeholder="Search by name, nutrient or benefit…" aria-label="Search fruits">
          </label>
          <select id="fruit-cat" class="field" aria-label="Filter by benefit"></select>
          <select id="fruit-season" class="field" aria-label="Filter by season"></select>
          <select id="fruit-sort" class="field" aria-label="Sort">
            <option value="az">Name: A to Z</option>
            <option value="za">Name: Z to A</option>
          </select>
          <label class="check-field"><input type="checkbox" id="fruit-saved"> Saved only</label>
        </div>
        <div class="az" id="fruit-az" role="group" aria-label="Filter by first letter"></div>
        <div class="results-bar"><p id="fruit-count"></p></div>
        <div class="herb-grid" id="fruit-grid"></div>
        <div class="empty-state" id="fruit-empty" hidden><p>No fruits match those filters.</p></div>
        <div class="center"><button class="btn btn-outline" id="fruit-more">Load more fruits</button></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/herbs-data.js"></script>

  <script src="js/content.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/devotional.js"></script>
  <script src="js/art.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/my-photos.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
