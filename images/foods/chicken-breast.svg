    <linearGradient id="meat2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eec28a"/><stop offset=".55" stop-color="#dc9d57"/><stop offset="1" stop-color="#bb7838"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6b4f2a" flood-opacity=".28"/></filter>
