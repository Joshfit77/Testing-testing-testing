<!-- Password reset. Links to /auth/confirm with the token hash (not the default confirmation URL), so it works in
     any browser: a reset asked for in the iPhone app is opened in Safari when the link is tapped in Mail. -->
<h2>Reset your password</h2>

<p>Follow the link below to choose a new password for your Narrow Gate Fitness account. The link works once and expires after an hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Choose a new password</a></p>
<p>If you didn't ask to reset your password, you can ignore this email. Your password stays the same.</p>
