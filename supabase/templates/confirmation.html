<!-- Sign-up confirmation. Links to /auth/confirm with the token hash (not the default confirmation URL), so it works
     in any browser: a link tapped in Mail opens in Safari, not in the iPhone app where the sign-up was made. -->
<h2>Confirm your email address</h2>

<p>Follow the link below to confirm this email address and finish signing up for Narrow Gate Fitness.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/onboarding">Confirm email address</a></p>
<p>If you didn't create an account, you can ignore this email.</p>
